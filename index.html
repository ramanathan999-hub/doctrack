async function getConditionalDocs(dest,incoterms,customerName=''){
  const[{data:docRules},{data:custRules}]=await Promise.all([
    sb.from('doc_rules').select('*'),
    sb.from('customer_doc_rules').select('*')
  ]);
  const d=(dest||'').toLowerCase();
  const inc=(incoterms||'').toLowerCase();
  const cust=(customerName||'').toLowerCase();
  const extraFromCustRules=(custRules||[])
    .filter(r=>{
      const custMatch=!r.customer_name||cust.includes(r.customer_name.toLowerCase());
      const destMatch=!r.destination_country||d.includes(r.destination_country.toLowerCase());
      return custMatch&&destMatch;
    })
    .flatMap(r=>Array.from({length:r.copies_required||1},(_,i)=>({
      docType:i===0?r.document_type:`${r.document_type} (Copy ${i+1})`,
      category:'Customer docs',source:'Customer Rule',signatureRequired:false
    })));
  const extraFromDocRules=(docRules||[])
    .filter(r=>{
      if(r.condition_field==='destination')return d.includes(r.condition_value.toLowerCase());
      if(r.condition_field==='incoterms')return inc===r.condition_value.toLowerCase();
      return false;
    })
    .map(r=>({docType:r.document_type,category:r.category,source:r.source||'',signatureRequired:!!r.signature_required}));
  return[...extraFromDocRules,...extraFromCustRules];
}

/* ── ISO 6346 container number validation ── */
function validateISO6346(raw){
  const s=(raw||'').toUpperCase().replace(/[\s\-]/g,'');
  if(!/^[A-Z]{4}\d{7}$/.test(s))return{valid:false,msg:'Format must be AAAU 000000 0'};
  const letters='0ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const vals=Array.from({length:26},(_,i)=>{const v=i+10+Math.floor((i+10)/11);return v;});
  const charVal=c=>{if(/\d/.test(c))return parseInt(c);const i=letters.indexOf(c);return i>=0?vals[i-1]:0;};
  const sum=Array.from(s.slice(0,10)).reduce((acc,c,i)=>acc+charVal(c)*Math.pow(2,i),0);
  const check=sum%11===10?0:sum%11;
  return parseInt(s[10])===check
    ?{valid:true,msg:'Valid ISO 6346'}
    :{valid:false,msg:`Check digit should be ${check}`};
}

function getProgress(order,ot){
  if(!ot)return{done:0,total:0,pct:0};
  const req=ot.docs.filter(d=>d.required).map(d=>d.id);
  const reqDocs=order.documents.filter(d=>req.includes(d.docId));
  const done=reqDocs.filter(d=>d.status==="Verified"||d.status==="Waived").length;
  return{done,total:req.length,pct:req.length?Math.round(done/req.length*100):0};
}

function DonutChart({segments,size=130}){
  const total=segments.reduce((s,d)=>s+d.v,0);
  if(!total)return null;
  const cx=size/2,cy=size/2,R=size*0.43,r=size*0.27;
  let angle=-Math.PI/2;
  const paths=segments.map(d=>{
    const sweep=(d.v/total)*2*Math.PI;
    const end=angle+sweep;
    const lg=sweep>Math.PI?1:0;
    const [c1,s1,c2,s2]=[Math.cos(angle),Math.sin(angle),Math.cos(end),Math.sin(end)];
    const path=`M${cx+R*c1} ${cy+R*s1} A${R} ${R} 0 ${lg} 1 ${cx+R*c2} ${cy+R*s2} L${cx+r*c2} ${cy+r*s2} A${r} ${r} 0 ${lg} 0 ${cx+r*c1} ${cy+r*s1}Z`;
    angle=end;
    return{...d,path};
  });
  return(
    <svg width={size} height={size} style={{flexShrink:0}}>
      {paths.map(p=><path key={p.label} d={p.path} fill={p.color} stroke="#fff" strokeWidth={2}/>)}
      <text x={cx} y={cy-5} textAnchor="middle" fontSize={size*0.18} fontWeight={600} fill="#0f172a" fontFamily="DM Sans,sans-serif">{total}</text>
      <text x={cx} y={cy+11} textAnchor="middle" fontSize={size*0.08} fill="#94a3b8" fontFamily="JetBrains Mono,monospace" letterSpacing="0.08em">ORDERS</text>
    </svg>
  );
}

function expiryState(validUntil){
  if(!validUntil)return null;
  const days=Math.round((new Date(validUntil)-new Date())/86400000);
  if(days<0)return{label:`Expired ${Math.abs(days)}d ago`,short:"Expired",color:"#dc2626",bg:"#fee2e2"};
  if(days===0)return{label:"Expires today",short:"Today",color:"#dc2626",bg:"#fee2e2"};
  if(days<=30)return{label:`Expires in ${days}d`,short:`${days}d`,color:"#d97706",bg:"#fef3c7"};
  return{label:`Valid until ${validUntil}`,short:validUntil,color:"#16a34a",bg:"#dcfce7"};
}

function Sparkline({data,height=52,color="#2563eb"}){
  if(!data||data.length===0)return null;
  const max=Math.max(...data.map(d=>d.v),1);
  const barW=22,gap=6,labelH=14,valH=12;
  const W=data.length*(barW+gap)-gap;
  const chartH=height-labelH-valH;
  return(
    <svg width={W} height={height} style={{overflow:"visible"}}>
      {data.map((d,i)=>{
        const h=d.v>0?Math.max(3,Math.round((d.v/max)*chartH)):2;
        const x=i*(barW+gap);
        const y=valH+chartH-h;
        return(
          <g key={d.label}>
            <rect x={x} y={y} width={barW} height={h} rx={3} fill={color} opacity={d.v>0?.8:.2}/>
            {d.v>0&&<text x={x+barW/2} y={y-3} textAnchor="middle" fontSize={9} fill="#475569" fontFamily="JetBrains Mono,monospace">{d.v}d</text>}
            <text x={x+barW/2} y={height} textAnchor="middle" fontSize={9} fill="#94a3b8" fontFamily="JetBrains Mono,monospace">{d.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

function Dashboard({onNav}){
  const[orders,setOrders]=useState(null);
  const[allItems,setAllItems]=useState([]);
  const[period,setPeriod]=useState('all');

  useEffect(()=>{
    async function load(){
      const[{data:ords},{data:its}]=await Promise.all([
        sb.from('orders').select('order_number,customer_name,destination_country,status,progress_pct,ready_to_ship,created_at,checked_at,due_date').order('created_at',{ascending:false}),
        sb.from('checklist_items').select('order_number,document_type,status,valid_until')
      ]);
      setOrders(ords||[]);
      setAllItems(its||[]);
    }
    load();
  },[]);

  if(orders===null)return<div style={{padding:40,textAlign:"center",color:"#94a3b8",fontSize:13}}>Loading&#x2026;</div>;

  const cutoff=period==='all'?null:(()=>{const d=new Date();if(period==='week')d.setDate(d.getDate()-7);else d.setMonth(d.getMonth()-1);return d;})();
  const filtered=cutoff?orders.filter(o=>new Date(o.created_at)>=cutoff):orders;
  const filteredNums=new Set(filtered.map(o=>o.order_number));

  const byStatus={"New":0,"In Progress":0,"On Hold":0,"Complete":0};
  filtered.forEach(o=>{if(byStatus[o.status]!==undefined)byStatus[o.status]++;});

  const done=filtered.filter(o=>o.status==='Complete'&&o.checked_at&&o.created_at);
  const avgDays=done.length>0
    ?Math.round(done.reduce((s,o)=>s+(new Date(o.checked_at)-new Date(o.created_at))/86400000,0)/done.length)
    :null;

  const DONE_S=new Set(['Verified','Waived','Complete','Received']);
  const gapMap={};
  allItems.filter(i=>filteredNums.has(i.order_number)).forEach(i=>{
    const t=i.document_type||'Unknown';
    if(!gapMap[t])gapMap[t]={total:0,pending:0};
    gapMap[t].total++;
    if(!DONE_S.has(i.status))gapMap[t].pending++;
  });
  const docGaps=Object.entries(gapMap)
    .map(([t,v])=>({type:t,...v}))
    .filter(x=>x.pending>0)
    .sort((a,b)=>b.pending-a.pending)
    .slice(0,8);
  const maxPending=docGaps.length>0?docGaps[0].pending:1;

  const today=toDay();
  const overdueOrders=filtered.filter(o=>o.due_date&&o.due_date<today&&o.status!=='Complete');

  const now2=new Date();
  const monthlyLeadTime=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now2.getFullYear(),now2.getMonth()-i,1);
    const mo=d.toISOString().slice(0,7);
    const label=d.toLocaleDateString('en-GB',{month:'short'});
    const md=done.filter(o=>o.checked_at&&o.checked_at.slice(0,7)===mo);
    const avg=md.length>0?Math.round(md.reduce((s,o)=>s+(new Date(o.checked_at)-new Date(o.created_at))/86400000,0)/md.length):0;
    monthlyLeadTime.push({label,v:avg});
  }

  const expiring=allItems.filter(i=>{
    if(!i.valid_until||DONE_S.has(i.status))return false;
    return(new Date(i.valid_until)-new Date())/86400000<=30;
  });

  const donut=[
    {label:"Complete",   v:byStatus["Complete"],   color:"#16a34a"},
    {label:"In Progress",v:byStatus["In Progress"],color:"#2563eb"},
    {label:"On Hold",    v:byStatus["On Hold"],    color:"#d97706"},
    {label:"New",        v:byStatus["New"],        color:"#cbd5e1"},
  ].filter(s=>s.v>0);

  const statCards=[
    {label:"Total orders",  val:filtered.length,         icon:"ti-clipboard-list", color:"#0f172a",accent:"#f1f5f9"},
    {label:"In progress",   val:byStatus["In Progress"], icon:"ti-clock",          color:"#2563eb",accent:"#dbeafe"},
    {label:"Complete",      val:byStatus["Complete"],    icon:"ti-circle-check",   color:"#16a34a",accent:"#dcfce7"},
    {label:"Avg lead time", val:avgDays!=null?`${avgDays}d`:"—",icon:"ti-calendar-stats",color:"#7c3aed",accent:"#ede9fe"},
  ];

  return(
    <div>
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {[['all','All time'],['month','This month'],['week','This week']].map(([p,label])=>(
          <button key={p} onClick={()=>setPeriod(p)} style={{fontSize:11,padding:"4px 12px",borderRadius:6,background:period===p?"#0f172a":"#fff",color:period===p?"#fff":"#64748b",border:`1px solid ${period===p?"#0f172a":"#e2e8f0"}`,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>
            {label}
          </button>
        ))}
      </div>

      {/* Row 1: Stat cards + Status breakdown donut side by side */}
      <div style={{display:"flex",gap:12,marginBottom:12,alignItems:"stretch"}}>
        <div className="dt-stat-grid" style={{flex:1,margin:0}}>
          {statCards.map(s=>(
            <div key={s.label} className="dt-stat" style={{borderTop:`3px solid ${s.accent}`,padding:"14px 16px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div>

                  <div style={{fontSize:34,fontWeight:600,color:s.color,lineHeight:1}}>{s.val}</div>
                </div>
                <div style={{width:38,height:38,borderRadius:9,background:s.accent,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  <i className={`ti ${s.icon}`} style={{fontSize:19,color:s.color}}/>
                </div>
              </div>
            </div>
          ))}
        </div>
        <div className="dt-card" style={{width:210,flexShrink:0,padding:"16px 18px"}}>
          <div style={{fontSize:13,fontWeight:500,color:"#0f172a",marginBottom:14}}>Status breakdown</div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:14}}>
            <DonutChart segments={donut} size={120}/>
            <div style={{width:"100%"}}>
              {[
                {label:"Complete",   color:"#16a34a",v:byStatus["Complete"]},
                {label:"In Progress",color:"#2563eb",v:byStatus["In Progress"]},
                {label:"On Hold",    color:"#d97706",v:byStatus["On Hold"]},
                {label:"New",        color:"#cbd5e1",v:byStatus["New"]},
              ].map(s=>(
                <div key={s.label} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>

            </div>
          </div>
        </div>

            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function OrdersList({onSelect,showToast,canEdit}){
  const[orders,setOrders]=useState([]);
  const[loading,setLoading]=useState(true);
  const[search,setSearch]=useState("");
  const[sf,setSf]=useState("All");
  const[csvModal,setCsvModal]=useState(false);
  useEffect(()=>{load();},[]);
  async function load(){
    setLoading(true);
    const{data}=await sb.from('orders')
      .select('order_number,customer_name,destination_country,status,progress_pct')
      .order('created_at',{ascending:false});
    if(data&&data.length>0){setOrders(data);}
    else{setOrders(SEED_ORDERS.map(o=>({order_number:o.id,customer_name:o.customer,destination_country:null,status:o.orderStatus,progress_pct:getProgress(o,SEED_ORDER_TYPES.find(t=>t.id===o.orderTypeId)).pct})));}
    setLoading(false);
  }
  const filtered=orders.filter(o=>{
    const ms=!search||
      (o.customer_name||'').toLowerCase().includes(search.toLowerCase())||
      (o.order_number||'').toLowerCase().includes(search.toLowerCase())||
      (o.destination_country||'').toLowerCase().includes(search.toLowerCase());
    return ms&&(sf==="All"||o.status===sf);
  });
  return(
    <div>
      <div className="dt-filters">
        <div className="dt-search-wrap">
          <i className="ti ti-search dt-search-icon"/>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search orders&#x2026;"/>
        </div>
        <select value={sf} onChange={e=>setSf(e.target.value)} style={{width:"auto"}}>
          <option value="All">All statuses</option>
          {ORDER_STATUSES.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        {canEdit&&<button onClick={()=>setCsvModal(true)} style={{display:"flex",alignItems:"center",gap:5,fontSize:13,whiteSpace:"nowrap"}}>
          <i className="ti ti-file-spreadsheet"/>Import CSV
        </button>}
      </div>
      {csvModal&&<CsvImportModal onClose={()=>setCsvModal(false)} showToast={showToast} onImported={()=>{setCsvModal(false);load();}}/>}
      <div className="dt-card">
        <table className="dt-table">
          <thead><tr>{["Order Number","Customer","Destination","Progress","Status",""].map(h=><th key={h} className="dt-th">{h}</th>)}</tr></thead>
          <tbody>
            {loading
              ?<tr><td colSpan={6} style={{padding:"32px",textAlign:"center",color:"#94a3b8",fontSize:13}}>Loading&#x2026;</td></tr>
              :filtered.length===0
                ?<tr><td colSpan={6} style={{padding:"32px",textAlign:"center",color:"#94a3b8",fontSize:13}}>No orders found</td></tr>
                :filtered.map((o,i)=>{
                  const last=i===filtered.length-1;
                  return(
                    <tr key={o.order_number} className={`dt-tr-click${last?" dt-tr-last":""}`} onClick={()=>onSelect(o.order_number)}>
                      <td className="dt-td mono" style={{fontSize:11,color:"#2563eb"}}>{o.order_number}</td>
                      <td className="dt-td" style={{fontWeight:500}}>{o.customer_name}</td>
                      <td className="dt-td" style={{fontSize:12,color:"#64748b"}}>{o.destination_country||"&#x2014;"}</td>
                      <td className="dt-td"><Progress pct={o.progress_pct||0}/></td>
                      <td className="dt-td"><Badge label={o.status||"New"} cfg={ORDER_BADGE}/></td>
                      <td className="dt-td"><i className="ti ti-chevron-right" style={{fontSize:13,color:"#94a3b8"}}/></td>
                    </tr>
                  );
                })
            }
          </tbody>
        </table>
      </div>
    </div>
  );
}

function OrderDetail({orderId,currentUser,onBack,showToast}){
  const[order,setOrder]=useState(null);
  const[items,setItems]=useState([]);
  const[activity,setActivity]=useState([]);
  const[shipmentEvents,setShipmentEvents]=useState([]);
  const[loading,setLoading]=useState(true);
  const[isSeed,setIsSeed]=useState(false);
  const[editId,setEditId]=useState(null);
  const[editStatus,setEditStatus]=useState('');
  const[editNotes,setEditNotes]=useState('');
  const[editExpiry,setEditExpiry]=useState('');
  const[editSigReq,setEditSigReq]=useState(false);
  const[requestingSig,setRequestingSig]=useState(null);
  const ro=!canEdit(currentUser.role);
  const[uploading,setUploading]=useState(null);
  const[uploadTarget,setUploadTarget]=useState(null);
  const fileInputRef=useRef(null);
  const[addingEvent,setAddingEvent]=useState(false);
  const[newEvType,setNewEvType]=useState(SHIPMENT_MILESTONES[0].type);
  const[newEvDate,setNewEvDate]=useState('');
  const[newEvNotes,setNewEvNotes]=useState('');
  const[savingEvent,setSavingEvent]=useState(false);
  const[sigModal,setSigModal]=useState(null);
  const[sigSentModal,setSigSentModal]=useState(null);
  const[containerInput,setContainerInput]=useState('');
  const[editingContainer,setEditingContainer]=useState(false);
  const[savingContainer,setSavingContainer]=useState(false);
  const[downloadingAll,setDownloadingAll]=useState(false);
  const[historyModal,setHistoryModal]=useState(null);
  const[docVersions,setDocVersions]=useState([]);
  const[freightEdit,setFreightEdit]=useState(false);
  const[freightBudget,setFreightBudget]=useState('');
  const[freightActual,setFreightActual]=useState('');
  const[freightTolerance,setFreightTolerance]=useState(10);
  const[savingFreight,setSavingFreight]=useState(false);

  useEffect(()=>{load();},[orderId]);

  async function load(){
    setLoading(true);
    const{data:sbOrder}=await sb.from('orders').select('*').eq('order_number',orderId).maybeSingle();
    if(sbOrder){
      const[{data:sbItems},{data:sbAct},{data:sbEvs}]=await Promise.all([
        sb.from('checklist_items').select('*').eq('order_number',orderId).order('category'),
        sb.from('order_activity').select('*').eq('order_number',orderId).order('created_at',{ascending:false}).limit(50),
        sb.from('shipment_events').select('*').eq('order_number',orderId).order('event_date',{ascending:true})
      ]);
      setOrder(sbOrder);setItems(sbItems||[]);setActivity(sbAct||[]);setShipmentEvents(sbEvs||[]);setIsSeed(false);
      setContainerInput(sbOrder.container_numbers||'');
      setFreightBudget(sbOrder.freight_cost_budget||'');
      setFreightActual(sbOrder.freight_cost_actual||'');
      setFreightTolerance(sbOrder.freight_cost_tolerance_pct||10);
    } else {
      const seed=SEED_ORDERS.find(o=>o.id===orderId);
      if(seed){
        const ot=SEED_ORDER_TYPES.find(t=>t.id===seed.orderTypeId);
        setOrder({order_number:seed.id,customer_name:seed.customer,destination_country:null,status:seed.orderStatus,progress_pct:ot?getProgress(seed,ot).pct:0,created_at:seed.createdAt,due_date:seed.dueDate,ref:seed.ref});
        setItems(ot?ot.docs.map(def=>{const ds=seed.documents.find(d=>d.docId===def.id)||{status:"Pending",notes:""};return{id:def.id,document_type:def.name,category:def.category||"—",condition:def.required?"Always":"Conditional",status:ds.status,notes:ds.notes||""};}):[]);
        setIsSeed(true);
      }
      setActivity([]);setShipmentEvents([]);
    }
    setLoading(false);
  }

  async function logActivity(action,detail){
    if(isSeed)return;
    await sb.from('order_activity').insert({
      order_number:order.order_number,
      user_email:currentUser?.email||currentUser?.username||'unknown',
      action,detail
    });
    const{data:fresh}=await sb.from('order_activity').select('*').eq('order_number',order.order_number).order('created_at',{ascending:false}).limit(50);
    if(fresh)setActivity(fresh);
  }

  async function generateShare(){
    if(isSeed){showToast("Demo orders can't be shared",false);return;}
    let token=order.share_token;
    if(!token){
      token=crypto.randomUUID();
      const{error}=await sb.from('orders').update({share_token:token}).eq('order_number',order.order_number);
      if(error){showToast('Failed to generate share link: '+error.message,false);return;}
      setOrder(p=>({...p,share_token:token}));
    }
    const url=`${location.origin}${location.pathname}?share=${token}`;
    try{await navigator.clipboard.writeText(url);showToast('Share link copied to clipboard');}
    catch{showToast('Share link: '+url);}
  }

  async function addShipmentEvent(){
    if(!newEvDate||isSeed)return;
    setSavingEvent(true);
    const{error}=await sb.from('shipment_events').insert({
      order_number:order.order_number,
      event_type:newEvType,
      event_date:newEvDate,
      notes:newEvNotes||null,
      created_by:currentUser?.email||currentUser?.username||'unknown'
    });
    if(error){showToast('Failed to add event: '+error.message,false);setSavingEvent(false);return;}
    const{data:fresh}=await sb.from('shipment_events').select('*').eq('order_number',order.order_number).order('event_date',{ascending:true});
    if(fresh)setShipmentEvents(fresh);
    setAddingEvent(false);setNewEvDate('');setNewEvNotes('');setNewEvType(SHIPMENT_MILESTONES[0].type);
    showToast('Milestone added');setSavingEvent(false);
  }

  function startEdit(item){
    setEditId(item.id);
    setEditStatus(item.status||'Pending');
    setEditNotes(item.notes||'');
    setEditExpiry(item.valid_until||'');
    setEditSigReq(!!item.signature_required);
  }

  async function saveOverride(item){
    const patch={status:editStatus,notes:editNotes,valid_until:editExpiry||null,signature_required:editSigReq};
    if(!isSeed){
      const{error}=await sb.from('checklist_items').update(patch).eq('id',item.id);
      if(error){showToast('Save failed: '+error.message,false);return;}
    }
    await logActivity('override',{doc_type:item.document_type,from:item.status,to:editStatus,notes:editNotes,expiry:editExpiry||null});
    setItems(p=>p.map(i=>i.id===item.id?{...i,...patch}:i));
    setEditId(null);showToast('Document updated');
  }

  async function submitDoc(item){
    if(!isSeed){await sb.from('checklist_items').update({status:'Received'}).eq('id',item.id);}
    await logActivity('submit',{doc_type:item.document_type});
    setItems(p=>p.map(i=>i.id===item.id?{...i,status:'Received'}:i));
    showToast('Document submitted');
  }

  async function openDoc(item){
    const folder=(item.category||'').trim().replace(/ /g,'_');
    const docName=(item.document_type||item.doc_type||'').trim().replace(/ /g,'_');
    const storagePath=`${order.order_number}/${folder}/${docName}_${order.order_number}.pdf`;
    const{data,error}=await sb.storage.from('documents').createSignedUrl(storagePath,3600);
    if(error||!data?.signedUrl){showToast('Document not available in storage',false);return;}
    window.open(data.signedUrl,'_blank');
  }

  async function downloadDoc(item){
    const folder=(item.category||'').trim().replace(/ /g,'_');
    const docName=(item.document_type||item.doc_type||'').trim().replace(/ /g,'_');
    const fileName=`${docName}_${order.order_number}.pdf`;
    const storagePath=`${order.order_number}/${folder}/${fileName}`;
    const{data,error}=await sb.storage.from('documents').createSignedUrl(storagePath,60,{download:fileName});
    if(error||!data?.signedUrl){showToast('Document not available in storage',false);return;}
    const a=document.createElement('a');a.href=data.signedUrl;a.download=fileName;a.click();
  }

  async function downloadAllDocs(){
    if(isSeed){showToast('Not available for demo orders',false);return;}
    setDownloadingAll(true);
    showToast('Preparing documents…');
    try{
      const{PDFDocument}=window.PDFLib;
      const urlResults=await Promise.all(items.map(async item=>{
        const folder=(item.category||'').trim().replace(/ /g,'_');
        const docName=(item.document_type||'').trim().replace(/ /g,'_');
        const path=`${order.order_number}/${folder}/${docName}_${order.order_number}.pdf`;
        const{data}=await sb.storage.from('documents').createSignedUrl(path,300);
        return data?.signedUrl?{url:data.signedUrl,name:docName,cat:item.category}:null;
      }));
      const valid=urlResults.filter(Boolean);
      if(!valid.length){showToast('No PDFs found in storage',false);setDownloadingAll(false);return;}
      const fetched=await Promise.all(valid.map(async v=>{
        try{const r=await fetch(v.url);if(!r.ok)return null;return{bytes:await r.arrayBuffer(),name:v.name};}
        catch{return null;}
      }));
      const loaded=fetched.filter(Boolean);
      if(!loaded.length){showToast('Could not fetch PDFs',false);setDownloadingAll(false);return;}
      const MAX=5*1024*1024;
      let mergedDoc=await PDFDocument.create();let mergedSize=0;let partNum=1;const parts=[];
      const flush=async doc=>{const bytes=await doc.save();parts.push(bytes);};
      for(const{bytes}of loaded){
        const src=await PDFDocument.load(bytes,{ignoreEncryption:true});
        const pages=await mergedDoc.copyPagesFrom(src,src.getPageIndices());
        pages.forEach(p=>mergedDoc.addPage(p));
        mergedSize+=bytes.byteLength;
        if(mergedSize>=MAX){await flush(mergedDoc);mergedDoc=await PDFDocument.create();mergedSize=0;partNum++;}
      }
      if(mergedDoc.getPageCount()>0)await flush(mergedDoc);
      parts.forEach((bytes,i)=>{
        const blob=new Blob([bytes],{type:'application/pdf'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url;a.download=parts.length>1?`${order.order_number}_docs_part${i+1}.pdf`:`${order.order_number}_all_documents.pdf`;
        a.click();URL.revokeObjectURL(url);
      });
      showToast(`Downloaded ${loaded.length} documents${parts.length>1?` in ${parts.length} files`:''}`);
    }catch(e){showToast('Download failed: '+e.message,false);}
    setDownloadingAll(false);
  }

  async function loadDocHistory(item){
    const{data}=await sb.from('document_versions')
      .select('*')
      .eq('order_number',order.order_number)
      .eq('document_type',item.document_type)
      .order('uploaded_at',{ascending:false});
    setDocVersions(data||[]);
    setHistoryModal(item);
  }

  async function updateOrderStatus(newStatus){
    if(!isSeed){
      const{error}=await sb.from('orders').update({status:newStatus,ready_to_ship:newStatus==="Complete"}).eq('order_number',order.order_number);
      if(error){showToast('Failed to update status',false);return;}
    }
    await logActivity('order_status',{from:order.status,to:newStatus});
    setOrder(p=>({...p,status:newStatus,ready_to_ship:newStatus==="Complete"}));
    showToast('Order status updated');
  }

  async function saveContainer(){
    if(isSeed){showToast('Not available for demo orders',false);setEditingContainer(false);return;}
    setSavingContainer(true);
    const{error}=await sb.from('orders').update({container_numbers:containerInput.trim()||null}).eq('order_number',order.order_number);
    if(error){showToast('Failed to save container number',false);}
    else{setOrder(p=>({...p,container_numbers:containerInput.trim()||null}));showToast('Container number saved');}
    setSavingContainer(false);setEditingContainer(false);
  }

  async function saveFreightCosts(){
    if(isSeed){showToast('Not available for demo orders',false);setFreightEdit(false);return;}
    setSavingFreight(true);
    const patch={freight_cost_budget:freightBudget?parseFloat(freightBudget):null,freight_cost_actual:freightActual?parseFloat(freightActual):null,freight_cost_tolerance_pct:parseInt(freightTolerance)||10};
    const{error}=await sb.from('orders').update(patch).eq('order_number',order.order_number);
    if(error){showToast('Failed to save freight costs',false);}
    else{setOrder(p=>({...p,...patch}));showToast('Freight costs saved');}
    setSavingFreight(false);setFreightEdit(false);
  }

  async function openSigModal(item){
    if(isSeed){showToast('Not available for demo orders',false);return;}
    setRequestingSig(item.id);
    try{
      const{data:rule}=await sb.from('signature_rules')
        .select('signer_email')
        .or(`country.eq.${order.destination_country||''},country.is.null`)
        .order('country',{ascending:false})
        .limit(1)
        .maybeSingle();
      setSigModal({item,signerEmail:rule?.signer_email||null});
    }catch(e){showToast('Could not load signer info',false);}
    setRequestingSig(null);
  }

  async function sendSigRequest(){
    const item=sigModal.item;
    const capturedEmail=sigModal.signerEmail;
    setSigModal(null);
    setRequestingSig(item.id);
    try{
      const res=await fetch('https://ramanathan999.app.n8n.cloud/webhook/request-signature',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({item_id:item.id,order_number:order.order_number,destination_country:order.destination_country||''})
      });
      if(!res.ok)throw new Error(`HTTP ${res.status}`);
      const data=await res.json();
      if(data.status==='no_document'){
        showToast('No PDF uploaded yet — upload the document before requesting a signature',false);
      }else if(data.status==='no_signer_configured'){
        showToast('No signer configured for this destination — add a signature rule in Admin → Signature Rules',false);
      }else if(data.status==='requested'){
        const signerEmail=capturedEmail||data.signer_email||'signer';
        await sb.from('checklist_items').update({signed_by:signerEmail}).eq('id',item.id);
        setItems(p=>p.map(i=>i.id===item.id?{...i,signature_status:'requested',signed_by:signerEmail}:i));
        setSigSentModal({email:signerEmail});
      }else{
        showToast('Signature request failed — unexpected response',false);
      }
    }catch(e){showToast('Signature request failed — check n8n workflow',false);}
    setRequestingSig(null);
  }

  function triggerUpload(item){setUploadTarget(item);fileInputRef.current.click();}

  async function handleFileSelect(e){
    const file=e.target.files[0];
    e.target.value='';
    if(!file||!uploadTarget)return;
    const item=uploadTarget;
    const folder=(item.category||'').trim().replace(/ /g,'_');
    const docName=(item.document_type||item.doc_type||'').trim().replace(/ /g,'_');
    const storagePath=`${order.order_number}/${folder}/${docName}_${order.order_number}.pdf`;
    setUploading(item.id);
    const{error}=await sb.storage.from('documents').upload(storagePath,file,{contentType:'application/pdf',upsert:true});
    if(error){showToast('Upload failed: '+error.message,false);}
    else{
      await logActivity('upload',{doc_type:item.document_type,path:storagePath});
      await sb.from('document_versions').update({is_current:false}).eq('order_number',order.order_number).eq('document_type',item.document_type);
      await sb.from('document_versions').insert({order_number:order.order_number,document_type:item.document_type,category:item.category||'',file_path:storagePath,uploaded_by:currentUser?.email||currentUser?.username||'unknown',file_size_bytes:file.size,is_current:true});
      if(!['Verified','Waived','Complete'].includes(item.status)&&!isSeed){
        await sb.from('checklist_items').update({status:'Received'}).eq('id',item.id);
        setItems(p=>p.map(i=>i.id===item.id?{...i,status:'Received'}:i));
      }
      showToast('Document uploaded');
    }
    setUploading(null);setUploadTarget(null);
  }

  if(loading)return<div style={{padding:40,textAlign:'center',color:'#94a3b8'}}>Loading&#x2026;</div>;
  if(!order)return<div style={{padding:40,textAlign:'center',color:'#94a3b8'}}>Order not found.</div>;

  const reqItems=items.filter(i=>!i.condition||i.condition==='Always');
  const reqDone=reqItems.filter(i=>i.status==='Verified'||i.status==='Waived'||i.status==='Complete').length;
  const reqTotal=reqItems.length||items.length;
  const pct=reqTotal>0?Math.round(reqDone/reqTotal*100):(order.progress_pct||0);

  return(
    <div>
      <input ref={fileInputRef} type="file" accept=".pdf" style={{display:"none"}} onChange={handleFileSelect}/>
      <button className="dt-back-btn" onClick={onBack}><i className="ti ti-arrow-left"/> Back to orders</button>
      <div className="dt-card" style={{padding:"16px 20px",marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12,flexWrap:"wrap"}}>
          <div>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,flexWrap:"wrap"}}>
              <span className="mono" style={{fontSize:12,color:"#2563eb"}}>{order.order_number}</span>
              {ro
                ?<Badge label={order.status||"New"} cfg={ORDER_BADGE}/>
                :<select value={order.status||"New"} onChange={e=>updateOrderStatus(e.target.value)} style={{fontSize:12,padding:"2px 8px",width:"auto",borderRadius:5}}>

            <Progress pct={pct}/>
            {!isSeed&&<button onClick={generateShare} style={{marginTop:8,fontSize:11,display:"flex",alignItems:"center",gap:4,color:"#2563eb",background:"none",border:"none",cursor:"pointer",padding:0,fontFamily:"'DM Sans',sans-serif",marginLeft:"auto"}}>
              <i className="ti ti-share" style={{fontSize:13}}/>{order.share_token?"Copy share link":"Generate share link"}
            </button>}
            {!isSeed&&<button onClick={downloadAllDocs} disabled={downloadingAll} style={{marginTop:6,fontSize:11,display:"flex",alignItems:"center",gap:4,color:downloadingAll?"#94a3b8":"#7c3aed",background:"none",border:"none",cursor:"pointer",padding:0,fontFamily:"'DM Sans',sans-serif",marginLeft:"auto",opacity:downloadingAll?.6:1}}>
              <i className={`ti ${downloadingAll?"ti-loader-2":"ti-file-zip"}`} style={{fontSize:13}}/>{downloadingAll?"Preparing…":"Download all docs"}
            </button>}
          </div>
        </div>
      </div>
      {!isSeed&&(
        <div className="dt-card" style={{marginBottom:14}}>
          <div className="dt-section-hdr" style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>

            {!ro&&<button onClick={()=>{setFreightEdit(p=>!p);}} style={{fontSize:11,padding:"3px 10px"}}>{freightEdit?"Cancel":"Edit"}</button>}
          </div>

            {freightEdit?(
              <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-end"}}>
                {[["BUDGET (EUR)",freightBudget,setFreightBudget,120],["ACTUAL (EUR)",freightActual,setFreightActual,120],["TOLERANCE (%)",freightTolerance,v=>setFreightTolerance(parseInt(v)||10),70]].map(([lbl,val,setter,w])=>(
                  <div key={lbl}>
                    <div style={{fontSize:10,color:"#94a3b8",fontWeight:600,letterSpacing:".05em",marginBottom:3}}>{lbl}</div>
                    <input type="number" value={val} onChange={e=>setter(e.target.value)} style={{fontSize:12,padding:"5px 8px",width:w}}/>
                  </div>

                <button onClick={saveFreightCosts} disabled={savingFreight} className="dt-btn-primary" style={{fontSize:12,padding:"5px 14px"}}>{savingFreight?"Saving…":"Save"}</button>
              </div>
            ):(
              <div style={{display:"flex",gap:28,flexWrap:"wrap",alignItems:"center"}}>
                {[["BUDGET",order.freight_cost_budget],["ACTUAL",order.freight_cost_actual],["TOLERANCE",order.freight_cost_tolerance_pct!=null?`${order.freight_cost_tolerance_pct}%`:null]].map(([lbl,val])=>(

                    <div style={{fontSize:14,fontWeight:500,color:"#0f172a"}}>{val!=null&&val!==''?(lbl!=="TOLERANCE"?`EUR ${parseFloat(val).toLocaleString()}`:val):"—"}</div>

                  const tol=order.freight_cost_tolerance_pct||10;

                    </td>
                    {!ro&&<td className="dt-td">
                      {editing?(

                        {v.is_current&&<span style={{fontSize:10,background:"#dcfce7",color:"#15803d",padding:"1px 6px",borderRadius:10,fontWeight:600}}>Current</span>}
                        {new Date(v.uploaded_at).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}

                    <button onClick={async()=>{const{data}=await sb.storage.from('documents').createSignedUrl(v.file_path,60,{download:v.file_path.split('/').pop()});if(data?.signedUrl){const a=document.createElement('a');a.href=data.signedUrl;a.download=v.file_path.split('/').pop();a.click();}}} style={{background:"none",border:"1px solid #e2e8f0",borderRadius:6,padding:"4px 10px",fontSize:11,cursor:"pointer",display:"flex",alignItems:"center",gap:4,color:"#64748b"}}>
                      <i className="ti ti-download" style={{fontSize:12}}/>Download

          </div>
        </div>
      )}

      {sigSentModal&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <div className="dt-card" style={{width:"100%",maxWidth:380,padding:"28px",margin:16,textAlign:"center"}}>
            <div style={{width:52,height:52,borderRadius:"50%",background:"#dcfce7",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px"}}>

            </div>
            <div style={{fontSize:15,fontWeight:600,color:"#0f172a",marginBottom:6}}>Email sent</div>
            <div style={{fontSize:13,color:"#64748b",marginBottom:20}}>Signature request sent to<br/><strong style={{color:"#0f172a"}}>{sigSentModal.email}</strong></div>
            <button onClick={()=>setSigSentModal(null)} className="dt-btn-primary" style={{fontSize:13,padding:"7px 24px"}}>Done</button>
          </div>
        </div>
      )}
    </div>
  );
}

function CountryDocNeedsView({showToast}){
  const[rules,setRules]=useState([]);
  const[loading,setLoading]=useState(true);
  const[addingRule,setAddingRule]=useState(false);
  const[viewMode,setViewMode]=useState('list'); // 'list' or 'grouped'
  const[newRule,setNewRule]=useState({document_type:'',category:'',source:'',condition_field:'destination',condition_value:'',signature_required:false});
  const ur=(k,v)=>setNewRule(p=>({...p,[k]:v}));

  useEffect(()=>{
    sb.from('doc_rules').select('*').order('condition_field').then(({data})=>{setRules(data||[]);setLoading(false);});
  },[]);

  async function saveRule(){
    if(!newRule.document_type.trim()||!newRule.condition_value.trim())return;
    const{data,error}=await sb.from('doc_rules').insert({...newRule,document_type:newRule.document_type.trim(),category:newRule.category.trim()||'General',source:newRule.source.trim(),condition_value:newRule.condition_value.trim()}).select().single();
    if(error){alert('Failed: '+error.message);return;}
    setRules(p=>[...p,data]);
    setNewRule({document_type:'',category:'',source:'',condition_field:'destination',condition_value:''});
    setAddingRule(false);
    showToast&&showToast('Rule added');
  }

  async function deleteRule(id){
    await sb.from('doc_rules').delete().eq('id',id);
    setRules(p=>p.filter(r=>r.id!==id));
    showToast&&showToast('Rule deleted');
  }

  async function toggleSigReq(id,current){
    const val=!current;
    await sb.from('doc_rules').update({signature_required:val}).eq('id',id);
    setRules(p=>p.map(r=>r.id===id?{...r,signature_required:val}:r));
  }

  const destRules=rules.filter(r=>r.condition_field==='destination');
  const incRules=rules.filter(r=>r.condition_field==='incoterms');

  function renderAddForm(){
    return addingRule&&(
      <div style={{padding:'12px 16px',background:'#f8fafc',borderBottom:'1px solid #e2e8f0',display:'flex',gap:8,flexWrap:'wrap',alignItems:'flex-end'}}>
        <div style={{display:'flex',flexDirection:'column',gap:3}}>
          <label style={{fontSize:10,color:'#94a3b8',letterSpacing:'.05em',textTransform:'uppercase'}}>Condition</label>
          <select value={newRule.condition_field} onChange={e=>ur('condition_field',e.target.value)} style={{fontSize:12,flex:'0 0 120px',width:120}}>
            <option value="destination">Destination</option>
            <option value="incoterms">Incoterms</option>
          </select>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:3}}>
          <label style={{fontSize:10,color:'#94a3b8',letterSpacing:'.05em',textTransform:'uppercase'}}>Country</label>
          <input value={newRule.condition_value} onChange={e=>ur('condition_value',e.target.value)} placeholder={newRule.condition_field==='destination'?'e.g. Turkey':'e.g. DDP'} style={{fontSize:12,width:120}}/>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:3,flex:1}}>
          <label style={{fontSize:10,color:'#94a3b8',letterSpacing:'.05em',textTransform:'uppercase'}}>Document type</label>
          <input value={newRule.document_type} onChange={e=>ur('document_type',e.target.value)} placeholder="e.g. ATR Certificate" style={{fontSize:12}}/>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:3}}>
          <label style={{fontSize:10,color:'#94a3b8',letterSpacing:'.05em',textTransform:'uppercase'}}>Category</label>
          <input value={newRule.category} onChange={e=>ur('category',e.target.value)} placeholder="e.g. Customs docs" style={{fontSize:12,width:130}}/>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:3}}>
          <label style={{fontSize:10,color:'#94a3b8',letterSpacing:'.05em',textTransform:'uppercase'}}>Source</label>
          <input value={newRule.source} onChange={e=>ur('source',e.target.value)} placeholder="e.g. Dutch Customs" style={{fontSize:12,width:130}}/>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:3,justifyContent:'flex-end'}}>
          <label style={{display:'flex',alignItems:'center',gap:4,fontSize:12,color:'#64748b',cursor:'pointer',whiteSpace:'nowrap',paddingBottom:6}}>
            <input type="checkbox" checked={newRule.signature_required} onChange={e=>ur('signature_required',e.target.checked)} style={{width:'auto'}}/>Sig. req.
          </label>
        </div>
        <button onClick={saveRule} disabled={!newRule.document_type||!newRule.condition_value} className="dt-btn-primary" style={{fontSize:12,padding:'6px 14px',alignSelf:'flex-end'}}>Add</button>
      </div>
    );
  }

  function renderListView(){
    if(loading)return <div style={{padding:'24px',textAlign:'center',color:'#94a3b8',fontSize:13}}>Loading…</div>;
    if(rules.length===0&&!addingRule)return <div style={{padding:'32px',textAlign:'center',color:'#94a3b8',fontSize:13}}>No rules yet. Add rules to auto-include documents based on destination country or incoterms.</div>;
    const byField={'destination':destRules,'incoterms':incRules};
    return Object.entries(byField).filter(([,rs])=>rs.length>0).map(([field,rs])=>(
      <div key={field}>
        <div style={{padding:'7px 16px',background:'#f8fafc',borderBottom:'1px solid #f1f5f9',display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:11,fontWeight:600,color:'#475569',letterSpacing:'.05em',textTransform:'uppercase'}}>{field==='destination'?'By destination country':'By incoterms'}</span>
          <span style={{fontSize:11,color:'#94a3b8'}}>{rs.length} rule{rs.length!==1?'s':''}</span>
        </div>
        <table className="dt-table">
          <thead><tr>
            <th className="dt-th">Country</th>
            <th className="dt-th">Document type</th>
            <th className="dt-th">Category</th>
            <th className="dt-th">Source</th>
            <th className="dt-th">Sig. req.</th>
            <th className="dt-th"/>
          </tr></thead>
          <tbody>
            {rs.map((r,i)=>(
              <tr key={r.id} className={i===rs.length-1?'dt-tr-last':''}>
                <td className="dt-td"><span className="dt-badge" style={{background:'#f1f5f9',color:'#475569',fontSize:11}}>{r.condition_value}</span></td>
                <td className="dt-td" style={{fontWeight:500}}>{r.document_type}</td>
                <td className="dt-td" style={{fontSize:12,color:'#64748b'}}>{r.category||'—'}</td>
                <td className="dt-td" style={{fontSize:12,color:'#64748b'}}>{r.source||'—'}</td>
                <td className="dt-td" style={{cursor:'pointer'}} onClick={()=>toggleSigReq(r.id,r.signature_required)} title="Click to toggle">{r.signature_required?<span className="dt-sig-badge" style={{background:'#ede9fe',color:'#7c3aed'}}><i className="ti ti-pencil-check" style={{fontSize:10}}/>Yes</span>:<span style={{color:'#94a3b8',fontSize:12}}>No</span>}</td>
                <td className="dt-td" style={{textAlign:'right'}}>
                  <button onClick={()=>deleteRule(r.id)} style={{background:'none',border:'none',padding:'2px 6px',cursor:'pointer',color:'#dc2626',fontSize:13,display:'inline-flex',alignItems:'center'}}>
                    <i className="ti ti-trash" style={{fontSize:14}}/>
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    ));
  }

  function renderGroupedView(){
    if(loading)return <div style={{padding:'24px',textAlign:'center',color:'#94a3b8',fontSize:13}}>Loading…</div>;
    if(destRules.length===0)return <div style={{padding:'32px',textAlign:'center',color:'#94a3b8',fontSize:13}}>No destination country rules yet.</div>;
    const byCountry={};
    destRules.forEach(r=>{
      const c=r.condition_value;
      if(!byCountry[c])byCountry[c]=[];
      byCountry[c].push(r);
    });
    const sorted=Object.keys(byCountry).sort();
    return sorted.map(country=>{
      const docs=byCountry[country];
      return(
        <div key={country} className="dt-card" style={{marginBottom:12}}>
          <div style={{padding:'11px 16px',borderBottom:'1px solid #f1f5f9',display:'flex',alignItems:'center',gap:10}}>
            <i className="ti ti-map-pin" style={{fontSize:14,color:'#64748b'}}/>
            <span style={{fontWeight:500,fontSize:14,color:'#0f172a'}}>{country}</span>
            <span style={{fontSize:12,color:'#94a3b8',marginLeft:4}}>{docs.length} document{docs.length!==1?'s':''} required</span>
          </div>
          <table className="dt-table">
            <thead><tr>
              <th className="dt-th">Document type</th>
              <th className="dt-th">Category</th>
              <th className="dt-th">Source</th>
              <th className="dt-th">Sig. req.</th>
              <th className="dt-th"/>
            </tr></thead>
            <tbody>
              {docs.map((r,i)=>(
                <tr key={r.id} className={i===docs.length-1?'dt-tr-last':''}>
                  <td className="dt-td" style={{fontWeight:500}}>{r.document_type}</td>
                  <td className="dt-td" style={{fontSize:12,color:'#64748b'}}>{r.category||'—'}</td>
                  <td className="dt-td" style={{fontSize:12,color:'#64748b'}}>{r.source||'—'}</td>
                  <td className="dt-td" style={{cursor:'pointer'}} onClick={()=>toggleSigReq(r.id,r.signature_required)} title="Click to toggle">{r.signature_required?<span className="dt-sig-badge" style={{background:'#ede9fe',color:'#7c3aed'}}><i className="ti ti-pencil-check" style={{fontSize:10}}/>Yes</span>:<span style={{color:'#94a3b8',fontSize:12}}>No</span>}</td>
                  <td className="dt-td" style={{textAlign:'right'}}>
                    <button onClick={()=>deleteRule(r.id)} style={{background:'none',border:'none',padding:'2px 6px',cursor:'pointer',color:'#dc2626',fontSize:13,display:'inline-flex',alignItems:'center'}}>
                      <i className="ti ti-trash" style={{fontSize:14}}/>
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    });
  }

  return(
    <div>
      <div className="dt-card" style={{marginBottom:16}}>
        <div className="dt-section-hdr">
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            Country document rules
            <div style={{display:'flex',gap:4,background:'#f1f5f9',borderRadius:6,padding:2}}>
              <button onClick={()=>setViewMode('list')} style={{fontSize:11,padding:'3px 10px',borderRadius:4,border:'none',background:viewMode==='list'?'#fff':'transparent',color:viewMode==='list'?'#0f172a':'#64748b',fontWeight:viewMode==='list'?500:400,boxShadow:viewMode==='list'?'0 1px 3px rgba(0,0,0,.08)':'none',cursor:'pointer'}}>List view</button>
              <button onClick={()=>setViewMode('grouped')} style={{fontSize:11,padding:'3px 10px',borderRadius:4,border:'none',background:viewMode==='grouped'?'#fff':'transparent',color:viewMode==='grouped'?'#0f172a':'#64748b',fontWeight:viewMode==='grouped'?500:400,boxShadow:viewMode==='grouped'?'0 1px 3px rgba(0,0,0,.08)':'none',cursor:'pointer'}}>By country</button>
            </div>
          </div>
          <button onClick={()=>setAddingRule(p=>!p)} style={{fontSize:12,display:'flex',alignItems:'center',gap:4,color:'#2563eb',background:'none',border:'none',cursor:'pointer',padding:0,fontFamily:"'DM Sans',sans-serif"}}>
            <i className={`ti ${addingRule?'ti-x':'ti-plus'}`}/>{addingRule?'Cancel':'Add rule'}
          </button>
        </div>
        {renderAddForm()}
        {viewMode==='list'?renderListView():renderGroupedView()}
      </div>
    </div>
  );
}

function CreateOrderModal({users,onClose,onCreate}){
  const DESTINATIONS=["Turkey","Greece","Cyprus","Egypt","Nigeria","Ghana","Kenya","Cameroon","Tanzania","Saudi Arabia","UAE","India","China","Singapore","USA","Other"];
  const INCOTERMS_LIST=["CIF","FOB","EXW","DAP","DDP","CFR"];
  const[f,setF]=useState({customer:"",ref:"",destination:"",incoterms:"CIF",assignedTo:users.find(u=>u.role!=="viewer")?.id||"",dueDate:""});
  const[saving,setSaving]=useState(false);
  const u=(k,v)=>setF(p=>({...p,[k]:v}));
  async function submit(){
    if(!f.customer||!f.destination)return;
    setSaving(true);
    await onCreate(f);
    setSaving(false);
  }
  return(
    <ModalWrap title="New order" onClose={onClose}>
      <FField label="Customer name"><input value={f.customer} onChange={e=>u("customer",e.target.value)} placeholder="Customer name" autoFocus/></FField>
      <FField label="Destination country">
        <select value={f.destination} onChange={e=>u("destination",e.target.value)}>
          <option value="">Select destination…</option>
          {DESTINATIONS.map(d=><option key={d} value={d}>{d}</option>)}
        </select>
      </FField>
      <FField label="Incoterms">
        <select value={f.incoterms} onChange={e=>u("incoterms",e.target.value)}>
          {INCOTERMS_LIST.map(i=><option key={i} value={i}>{i}</option>)}
        </select>
      </FField>
      <div style={{display:"flex",gap:8}}>
        <FField label="Reference / PO"><input value={f.ref} onChange={e=>u("ref",e.target.value)} placeholder="e.g. PO-2026-001"/></FField>
        <FField label="Due date"><input type="date" value={f.dueDate} onChange={e=>u("dueDate",e.target.value)}/></FField>
      </div>
      <div className="dt-modal-actions">
        <button onClick={onClose} disabled={saving}>Cancel</button>
        <button onClick={submit} disabled={saving||!f.customer||!f.destination} className="dt-btn-primary">
          {saving?"Creating…":"Create order"}
        </button>
      </div>
    </ModalWrap>
  );
}

function CsvImportModal({onClose,onImported,showToast}){
  const[step,setStep]=useState('upload'); // upload | preview | importing | done
  const[rows,setRows]=useState([]);
  const[errors,setErrors]=useState([]);
  const[progress,setProgress]=useState(0);
  const fileRef=useRef(null);
  const REQUIRED_COLS=['customer','destination'];
  const OPTIONAL_COLS=['ref','incoterms','due_date'];

  function parseFile(e){
    const file=e.target.files[0];
    if(!file)return;
    Papa.parse(file,{
      header:true,skipEmptyLines:true,
      complete:({data,meta})=>{
        const missing=REQUIRED_COLS.filter(c=>!meta.fields.map(f=>f.toLowerCase().trim()).includes(c));
        if(missing.length>0){setErrors([`Missing required columns: ${missing.join(', ')}`]);return;}
        const normalised=data.map((r,i)=>{
          const norm={};
          Object.keys(r).forEach(k=>{norm[k.toLowerCase().trim()]=r[k];});
          return{...norm,_row:i+2};
        });
        const errs=[];
        normalised.forEach(r=>{
          if(!r.customer)errs.push(`Row ${r._row}: customer is empty`);
          if(!r.destination)errs.push(`Row ${r._row}: destination is empty`);
        });
        setErrors(errs);
        setRows(normalised);
        setStep('preview');
      },
      error:(err)=>setErrors([err.message])
    });
  }

  async function doImport(){
    const validRows=rows.filter(r=>r.customer&&r.destination);
    if(validRows.length===0){showToast('No valid rows to import',false);return;}
    setStep('importing');setProgress(0);
    const{count}=await sb.from('orders').select('*',{count:'exact',head:true});
    let base=count||0;
    let imported=0;
    for(const r of validRows){
      const orderNumber=`SHP-${new Date().getFullYear()}-${String(++base).padStart(3,'0')}`;
      const{data:newOrder,error}=await sb.from('orders').insert({
        order_number:orderNumber,
        customer_name:r.customer,
        destination_country:r.destination,
        incoterms:r.incoterms||'CIF',
        due_date:r.due_date||null,
        status:'New',
        progress_pct:0,
        ready_to_ship:false
      }).select().single();
      if(!error&&newOrder){
        const baseDocs=getRequiredDocs();
        const condDocs=await getConditionalDocs(r.destination,r.incoterms||'CIF',r.customer);
        const docs=[...baseDocs,...condDocs];
        await sb.from('checklist_items').insert(docs.map(d=>({
          order_id:newOrder.id,
          order_number:orderNumber,
          category:d.category,
          document_type:d.docType,
          source:d.source,
          status:'Pending',
          signature_required:d.signatureRequired||false,
          expected:2,found:0
        })));
        imported++;
      }
      setProgress(Math.round((imported/validRows.length)*100));
    }
    setStep('done');
    showToast(`${imported} order${imported!==1?'s':''} imported`);
    onImported();
  }

  return(
    <ModalWrap title="Import orders from CSV" onClose={onClose}>
      {step==='upload'&&(
        <>
          <div style={{border:'2px dashed #e2e8f0',borderRadius:8,padding:'28px 20px',textAlign:'center',marginBottom:14,cursor:'pointer',background:'#fafafa'}} onClick={()=>fileRef.current.click()}>
            <i className="ti ti-file-spreadsheet" style={{fontSize:32,color:'#94a3b8',display:'block',marginBottom:8}}/>
            <div style={{fontSize:13,fontWeight:500,color:'#475569'}}>Click to choose a CSV file</div>
            <div style={{fontSize:11,color:'#94a3b8',marginTop:4}}>Required columns: <strong>customer</strong>, <strong>destination</strong></div>
            <div style={{fontSize:11,color:'#94a3b8'}}>Optional: ref, incoterms, due_date</div>
          </div>
          <input ref={fileRef} type="file" accept=".csv" style={{display:'none'}} onChange={parseFile}/>
          {errors.length>0&&<div style={{fontSize:12,color:'#b91c1c',background:'#fef2f2',border:'1px solid #fecaca',borderRadius:6,padding:'8px 10px',marginBottom:12}}>{errors.map((e,i)=><div key={i}>{e}</div>)}</div>}
          <div style={{fontSize:11,color:'#94a3b8',background:'#f8fafc',borderRadius:6,padding:'8px 10px',fontFamily:"'JetBrains Mono',monospace"}}>
            customer,destination,ref,incoterms,due_date<br/>
            "Acme Corp",Turkey,REF-001,CIF,2026-07-01
          </div>
          <div className="dt-modal-actions" style={{marginTop:14}}><button onClick={onClose}>Cancel</button></div>
        </>
      )}
      {step==='preview'&&(
        <>
          {errors.length>0&&<div style={{fontSize:12,color:'#b91c1c',background:'#fef2f2',border:'1px solid #fecaca',borderRadius:6,padding:'8px 10px',marginBottom:12}}>{errors.map((e,i)=><div key={i}>{e}</div>)}</div>}
          <div style={{fontSize:13,color:'#475569',marginBottom:10}}>{rows.filter(r=>r.customer&&r.destination).length} valid order{rows.filter(r=>r.customer&&r.destination).length!==1?'s':''} to import</div>
          <div style={{maxHeight:200,overflowY:'auto',border:'1px solid #e2e8f0',borderRadius:6,marginBottom:14}}>
            <table className="dt-table">
              <thead><tr><th className="dt-th">Customer</th><th className="dt-th">Destination</th><th className="dt-th">Incoterms</th><th className="dt-th">Due date</th></tr></thead>
              <tbody>
                {rows.slice(0,20).map((r,i)=>(<tr key={i} className={i===Math.min(rows.length,20)-1?'dt-tr-last':''}><td className="dt-td">{r.customer||<span style={{color:'#dc2626'}}>missing</span>}</td><td className="dt-td">{r.destination||<span style={{color:'#dc2626'}}>missing</span>}</td><td className="dt-td" style={{color:'#64748b'}}>{r.incoterms||'CIF'}</td><td className="dt-td mono" style={{fontSize:11,color:'#64748b'}}>{r.due_date||'—'}</td></tr>))}
              </tbody>
            </table>
          </div>
          <div className="dt-modal-actions">
            <button onClick={()=>{setStep('upload');setErrors([]);setRows([]);}}>Back</button>
            <button onClick={doImport} disabled={rows.filter(r=>r.customer&&r.destination).length===0} className="dt-btn-primary">Import {rows.filter(r=>r.customer&&r.destination).length} orders</button>
          </div>
        </>
      )}
      {step==='importing'&&(
        <div style={{textAlign:'center',padding:'20px 0'}}>
          <i className="ti ti-loader-2" style={{fontSize:28,color:'#2563eb',display:'block',marginBottom:10}}/>
          <div style={{fontSize:13,color:'#475569',marginBottom:12}}>Importing orders&#x2026; {progress}%</div>
          <div style={{height:6,background:'#f1f5f9',borderRadius:3,overflow:'hidden'}}>
            <div style={{height:'100%',width:`${progress}%`,background:'#2563eb',transition:'width .3s',borderRadius:3}}/>
          </div>
        </div>
      )}
      {step==='done'&&(
        <div style={{textAlign:'center',padding:'20px 0'}}>
          <i className="ti ti-circle-check" style={{fontSize:36,color:'#16a34a',display:'block',marginBottom:10}}/>
          <div style={{fontSize:14,fontWeight:500,color:'#0f172a',marginBottom:16}}>Import complete</div>
          <button onClick={onClose} className="dt-btn-primary">Close</button>
        </div>
      )}
    </ModalWrap>
  );
}

    if(!q.trim())return;
    setLoading(true);setError(null);setResults(null);
    try{
      const res=await fetch(`https://ramanathan999.app.n8n.cloud/webhook/kvk-search?naam=${encodeURIComponent(q.trim())}`);
      if(!res.ok)throw new Error(`Server returned ${res.status}`);
      const data=await res.json();

function SignatureRulesView({showToast}){
  const[rules,setRules]=useState([]);
  const[loading,setLoading]=useState(true);
  const[adding,setAdding]=useState(false);
  const[newRule,setNewRule]=useState({country:'',signer_name:'',signer_email:''});
  const ur=(k,v)=>setNewRule(p=>({...p,[k]:v}));

  useEffect(()=>{
    sb.from('signature_rules').select('*').order('country',{ascending:true,nullsFirst:false}).then(({data})=>{setRules(data||[]);setLoading(false);});
  },[]);

  async function addRule(){
    if(!newRule.signer_name.trim()||!newRule.signer_email.trim())return;
    const{data,error}=await sb.from('signature_rules').insert({
      country:newRule.country.trim()||null,
      signer_name:newRule.signer_name.trim(),
      signer_email:newRule.signer_email.trim()
    }).select().single();
    if(error){showToast('Failed: '+error.message,false);return;}
    setRules(p=>[...p,data].sort((a,b)=>{if(!a.country)return 1;if(!b.country)return -1;return a.country.localeCompare(b.country);}));
    setNewRule({country:'',signer_name:'',signer_email:''});
    setAdding(false);showToast('Signer rule added');
  }

  async function deleteRule(id){
    await sb.from('signature_rules').delete().eq('id',id);
    setRules(p=>p.filter(r=>r.id!==id));
    showToast('Rule removed');
  }

  if(loading)return<div style={{padding:40,textAlign:'center',color:'#94a3b8',fontSize:13}}>Loading…</div>;

  return(
    <div className="dt-card">
      <div className="dt-section-hdr">
        Signature rules — signer per country
        <button onClick={()=>setAdding(p=>!p)} style={{fontSize:12,display:'flex',alignItems:'center',gap:4,color:'#2563eb',background:'none',border:'none',cursor:'pointer',padding:0,fontFamily:"'DM Sans',sans-serif"}}>

            <label style={{fontSize:10,color:'#94a3b8',letterSpacing:'.05em',textTransform:'uppercase'}}>Country (blank = default fallback)</label>
            <input value={newRule.country} onChange={e=>ur('country',e.target.value)} placeholder="e.g. Turkey" style={{fontSize:12,width:150}}/>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:3,flex:1}}>
            <label style={{fontSize:10,color:'#94a3b8',letterSpacing:'.05em',textTransform:'uppercase'}}>Signer name</label>
            <input value={newRule.signer_name} onChange={e=>ur('signer_name',e.target.value)} placeholder="e.g. Turkey Compliance Team" style={{fontSize:12}}/>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:3,flex:1}}>
            <label style={{fontSize:10,color:'#94a3b8',letterSpacing:'.05em',textTransform:'uppercase'}}>Signer email</label>
            <input type="email" value={newRule.signer_email} onChange={e=>ur('signer_email',e.target.value)} placeholder="e.g. compliance@company.com" style={{fontSize:12}}/>
          </div>
          <button onClick={addRule} disabled={!newRule.signer_name||!newRule.signer_email} className="dt-btn-primary" style={{fontSize:12,padding:'6px 14px',alignSelf:'flex-end'}}>Add</button>
        </div>
      )}
      {rules.length===0&&!adding
        ?<div style={{padding:'32px',textAlign:'center',color:'#94a3b8',fontSize:13}}>No rules yet. Add a default signer first (leave country blank), then add country-specific overrides.</div>
        :<table className="dt-table">
          <thead><tr>
            <th className="dt-th">Country</th>
            <th className="dt-th">Signer name</th>
            <th className="dt-th">Signer email</th>
            <th className="dt-th"/>
          </tr></thead>
          <tbody>
            {rules.map((r,i)=>(
              <tr key={r.id} className={i===rules.length-1?'dt-tr-last':''}>
                <td className="dt-td">

                    ?<span className="dt-badge" style={{background:'#f1f5f9',color:'#475569',fontSize:11}}>{r.country}</span>
                    :<span className="dt-badge" style={{background:'#dcfce7',color:'#15803d',fontSize:11}}>Default — all countries</span>}
                </td>
                <td className="dt-td" style={{fontWeight:500}}>{r.signer_name}</td>

function CustomerPortalView({token}){
  const[customerName,setCustomerName]=useState(null);

  const[itemsByOrder,setItemsByOrder]=useState({});
  const[loading,setLoading]=useState(true);
  const[expanded,setExpanded]=useState(null);
  const[portalToast,setPortalToast]=useState(null);
  const[downloading,setDownloading]=useState(null);
  const showMsg=(msg,ok=true)=>{setPortalToast({msg,ok});setTimeout(()=>setPortalToast(null),3500);};

  useEffect(()=>{
    async function load(){
      const{data:portal}=await sb.from('customer_portals').select('customer_name').eq('portal_token',token).maybeSingle();
      if(!portal){setLoading(false);return;}
      setCustomerName(portal.customer_name);
      const cutoff=new Date();cutoff.setDate(cutoff.getDate()-90);
      const{data:ords}=await sb.from('orders').select('*').eq('customer_name',portal.customer_name).gte('created_at',cutoff.toISOString()).order('created_at',{ascending:false});
      setOrders(ords||[]);
      if(ords&&ords.length>0){
        const{data:its}=await sb.from('checklist_items').select('*').in('order_number',ords.map(o=>o.order_number));
        const map={};
        (its||[]).forEach(i=>{if(!map[i.order_number])map[i.order_number]=[];map[i.order_number].push(i);});
        setItemsByOrder(map);
        setExpanded(ords[0].order_number);
      }
      setLoading(false);
    }
    load();
  },[]);

  async function downloadDoc(item,orderNumber){
    setDownloading(item.id);
    const folder=(item.category||'').trim().replace(/ /g,'_');
    const docName=(item.document_type||'').trim().replace(/ /g,'_');
    const path=`${orderNumber}/${folder}/${docName}_${orderNumber}.pdf`;
    const{data,error}=await sb.storage.from('documents').createSignedUrl(path,3600);

    if(error||!data?.signedUrl){showMsg('Document not yet available for download',false);return;}

      <div style={{maxWidth:820,margin:'0 auto'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:20}}>
          <i className="ti ti-file-check" style={{fontSize:22,color:'#f97316'}}/>
          <div>
            <div style={{fontSize:15,fontWeight:500,color:'#0f172a'}}>DocTrack</div>
            <div style={{fontSize:9,color:'#94a3b8',fontFamily:"'JetBrains Mono',monospace",letterSpacing:'.1em'}}>CUSTOMER PORTAL</div>
          </div>

        <div className="dt-card" style={{padding:'14px 20px',marginBottom:16,display:'flex',alignItems:'center',gap:12}}>
          <div className="dt-avatar" style={{width:36,height:36,fontSize:13,flexShrink:0}}>{customerName.slice(0,2).toUpperCase()}</div>
          <div>
            <div style={{fontSize:15,fontWeight:500,color:'#0f172a'}}>{customerName}</div>
            <div style={{fontSize:12,color:'#94a3b8'}}>{orders.length} order{orders.length!==1?'s':''} — last 90 days</div>
          </div>
        </div>

        {orders.length===0
          ?<div className="dt-card" style={{padding:'40px',textAlign:'center'}}>
            <i className="ti ti-clipboard-list" style={{fontSize:32,color:'#e2e8f0',display:'block',marginBottom:12}}/>
            <div style={{fontSize:13,color:'#94a3b8'}}>No orders in the last 90 days</div>

            const items=itemsByOrder[order.order_number]||[];

                        <th className="dt-th">Category</th>

                  </div>
                )}
              </div>
            );
          })
        }
        <div style={{textAlign:'center',marginTop:20,fontSize:11,color:'#94a3b8'}}>
          Powered by DocTrack · Showing your active shipments only
        </div>
      </div>
      {portalToast&&<Toast toast={portalToast}/>}
    </div>
  );
}

function CustomerPortalsView({currentUser,showToast}){
  const[customers,setCustomers]=useState([]);
  const[portals,setPortals]=useState([]);
  const[loading,setLoading]=useState(true);

  useEffect(()=>{
    async function load(){
      const[{data:ords},{data:ps}]=await Promise.all([
        sb.from('orders').select('customer_name').order('customer_name'),
        sb.from('customer_portals').select('*')
      ]);
      const names=[...new Set((ords||[]).map(o=>o.customer_name).filter(Boolean))].sort();
      setCustomers(names);setPortals(ps||[]);setLoading(false);
    }
    load();
  },[]);

  async function generatePortal(name){
    const existing=portals.find(p=>p.customer_name===name);
    if(existing){
      await navigator.clipboard.writeText(`${location.origin}${location.pathname}?customer=${existing.portal_token}`);
      showToast('Portal link copied');return;
    }
    const token=crypto.randomUUID();
    const{error}=await sb.from('customer_portals').insert({portal_token:token,customer_name:name,created_by:currentUser?.email||currentUser?.username});
    if(error){showToast('Failed: '+error.message,false);return;}
    setPortals(p=>[...p,{portal_token:token,customer_name:name}]);
    await navigator.clipboard.writeText(`${location.origin}${location.pathname}?customer=${token}`);
    showToast('Portal created & link copied to clipboard');
  }

  async function revokePortal(name){
    const portal=portals.find(p=>p.customer_name===name);
    if(!portal)return;
    await sb.from('customer_portals').delete().eq('portal_token',portal.portal_token);
    setPortals(p=>p.filter(x=>x.customer_name!==name));
    showToast('Portal revoked');
  }

  if(loading)return<div style={{padding:40,textAlign:'center',color:'#94a3b8',fontSize:13}}>Loading&#x2026;</div>;

  return(
    <div className="dt-card">
      <div className="dt-section-hdr">
        Customer portals
        <span style={{fontSize:11,color:'#94a3b8',fontWeight:400}}>Generate a magic link per customer — no login required</span>
      </div>
      {customers.length===0
        ?<div style={{padding:'40px',textAlign:'center',color:'#94a3b8',fontSize:13}}>No customers yet — create orders first</div>
        :customers.map((name,i)=>{
          const portal=portals.find(p=>p.customer_name===name);
          const last=i===customers.length-1;
          return(
            <div key={name} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'11px 16px',borderBottom:last?'none':'1px solid #f1f5f9',gap:12,flexWrap:'wrap'}}>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <div className="dt-avatar" style={{flexShrink:0}}>{name.slice(0,2).toUpperCase()}</div>
                <div>
                  <div style={{fontSize:13,fontWeight:500,color:'#0f172a'}}>{name}</div>
                  <div style={{fontSize:11,color:portal?'#16a34a':'#94a3b8'}}>{portal?'Portal active':'No portal'}</div>
                </div>
              </div>
              <div style={{display:'flex',gap:6}}>
                <button onClick={()=>generatePortal(name)} style={{fontSize:12,display:'flex',alignItems:'center',gap:4,padding:'5px 12px',background:portal?'#dbeafe':'#f8fafc',border:`1px solid ${portal?'#bfdbfe':'#e2e8f0'}`,color:portal?'#1d4ed8':'#475569',borderRadius:6,cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>
                  <i className={`ti ${portal?'ti-link':'ti-plus'}`}/>{portal?'Copy link':'Generate portal'}
                </button>
                {portal&&<button onClick={()=>revokePortal(name)} style={{fontSize:12,padding:'5px 12px',color:'#b91c1c',background:'#fef2f2',border:'1px solid #fecaca',borderRadius:6,cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>Revoke</button>}
              </div>
            </div>
          );
        })
      }
    </div>
  );
}
