<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8"/>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;width:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:#f1f5f9}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}

/* Layout */
.dt-app{display:flex;height:100vh;width:100%;background:#f8fafc;overflow:hidden;position:relative}
.dt-sidebar{width:220px;background:#fff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;flex-shrink:0;height:100vh}
.dt-logo{padding:18px 16px 14px;border-bottom:1px solid #e2e8f0}
.dt-logo-name{font-size:16px;font-weight:500;color:#0f172a;display:flex;align-items:center;gap:8px}
.dt-logo-sub{font-size:9px;color:#94a3b8;letter-spacing:.1em;margin-top:3px;font-family:'JetBrains Mono',monospace}
.dt-nav{flex:1;padding:12px 8px;overflow-y:auto}
.dt-nav-section{font-size:9px;color:#94a3b8;letter-spacing:.1em;padding:8px 8px 4px;font-family:'JetBrains Mono',monospace;text-transform:uppercase}
.dt-nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;font-size:13.5px;color:#64748b;transition:all .12s;user-select:none}
.dt-nav-item:hover{background:#f8fafc;color:#0f172a}
.dt-nav-item.active{background:#f1f5f9;color:#0f172a;font-weight:500}
.dt-user-footer{padding:14px;border-top:1px solid #e2e8f0}
.dt-main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.dt-topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 24px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.dt-topbar-title{font-size:15px;font-weight:500;color:#0f172a}
.dt-content{flex:1;overflow-y:auto;padding:24px}

/* Cards & Tables */
.dt-card{background:#fff;border-radius:10px;border:1px solid #e2e8f0}
.dt-table{width:100%;border-collapse:collapse}
.dt-th{padding:9px 13px;font-size:11px;font-weight:500;color:#94a3b8;text-align:left;border-bottom:1px solid #e2e8f0;white-space:nowrap;letter-spacing:.03em;text-transform:uppercase}
.dt-td{padding:11px 13px;font-size:13.5px;color:#1e293b;border-bottom:1px solid #f1f5f9}
.dt-tr-last td{border-bottom:none}
.dt-tr-click{cursor:pointer}
.dt-tr-click:hover td{background:#fafafa}

/* Badges */
.dt-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;white-space:nowrap}

/* Progress */
.dt-progress-wrap{display:flex;align-items:center;gap:8px;min-width:100px}
.dt-progress-bar{flex:1;height:5px;background:#f1f5f9;border-radius:3px;overflow:hidden}
.dt-progress-fill{height:100%;border-radius:3px;transition:width .3s}
.dt-progress-pct{font-size:11px;color:#64748b;width:28px;font-family:'JetBrains Mono',monospace;flex-shrink:0}

/* Stats */
.dt-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.dt-stat{background:#fff;border-radius:10px;border:1px solid #e2e8f0;padding:16px}
.dt-stat-label{font-size:12px;color:#64748b;margin-bottom:6px}
.dt-stat-val{font-size:26px;font-weight:500}

/* Section header */
.dt-section-hdr{padding:13px 16px;border-bottom:1px solid #e2e8f0;font-size:13.5px;font-weight:500;color:#0f172a;display:flex;justify-content:space-between;align-items:center}

.dt-filters{display:flex;gap:8px;margin-bottom:16px}
.dt-search-wrap{position:relative;flex:1}
.dt-search-wrap input{padding-left:32px;width:100%}
.dt-search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:15px;color:#94a3b8;pointer-events:none}

/* Order detail */
.dt-back-btn{display:flex;align-items:center;gap:5px;font-size:13px;color:#64748b;cursor:pointer;margin-bottom:16px;background:none;border:none;padding:0;font-family:'DM Sans',sans-serif}
.dt-back-btn:hover{color:#0f172a}
.dt-order-meta{display:flex;gap:16px;font-size:12px;color:#64748b;margin-top:6px;flex-wrap:wrap}
.dt-order-meta span{display:flex;align-items:center;gap:4px}

/* Forms & Inputs */
input,select,textarea{font-family:'DM Sans',sans-serif;font-size:13.5px;padding:7px 10px;border:1px solid #e2e8f0;border-radius:6px;color:#0f172a;outline:none;background:#fff;width:100%}
input:focus,select:focus{border-color:#94a3b8}
button{font-family:'DM Sans',sans-serif;font-size:13.5px;padding:7px 14px;border:1px solid #e2e8f0;border-radius:6px;cursor:pointer;background:#fff;color:#475569;transition:background .12s}

.dt-modal{background:#fff;border-radius:12px;border:1px solid #e2e8f0;padding:24px;width:420px;max-width:90%;box-shadow:0 8px 32px rgba(0,0,0,.12)}

.dt-modal-title{font-size:15px;font-weight:500;color:#0f172a}

.dt-modal-close:hover{color:#0f172a}
.dt-field{margin-bottom:13px}
.dt-field label{display:block;font-size:11px;font-weight:500;color:#64748b;margin-bottom:4px;letter-spacing:.04em;text-transform:uppercase}

.dt-btn-primary{background:#0f172a;color:#fff;border-color:#0f172a}
.dt-btn-primary:hover{background:#1e293b}

.dt-login-card{width:360px;background:#fff;border-radius:12px;border:1px solid #e2e8f0;padding:28px 26px;box-shadow:0 4px 24px rgba(0,0,0,.06)}

/* Type items */

.dt-type-hdr{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;cursor:pointer}
.dt-type-hdr:hover{background:#fafafa}

/* Edit row */
.dt-edit-row td{background:#fafafa}
.dt-edit-row td input,.dt-edit-row td select{font-size:12px;padding:4px 7px;width:auto}

/* Helpers */

.mono{font-family:'JetBrains Mono',monospace}

/* Signature */
.dt-sig-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:500;padding:2px 7px;border-radius:3px}

.dt-timeline::before{content:'';position:absolute;left:10px;top:6px;bottom:6px;width:2px;background:#e2e8f0;border-radius:2px}
.dt-tl-item{position:relative;margin-bottom:18px}
.dt-tl-item:last-child{margin-bottom:0}

@media(max-width:768px){

  .dt-stat-grid{grid-template-columns:repeat(2,1fr)}

  .dt-topbar{padding:0 14px}
  .dt-card{overflow-x:auto}
  .dt-stat-grid{gap:8px}
  .dt-stat{padding:12px}

}
async function getConditionalDocs(dest,incoterms){
  const{data}=await sb.from('doc_rules').select('*');
  const d=(dest||'').toLowerCase();
  const inc=(incoterms||'').toLowerCase();
  return(data||[])
    .filter(r=>{
      if(r.condition_field==='destination')return d.includes(r.condition_value.toLowerCase());
      if(r.condition_field==='incoterms')return inc===r.condition_value.toLowerCase();
      return false;
    })
    .map(r=>({docType:r.document_type,category:r.category,source:r.source||'',signatureRequired:!!r.signature_required}));
}

function getProgress(order,ot){
  if(!ot)return{done:0,total:0,pct:0};
  const req=ot.docs.filter(d=>d.required).map(d=>d.id);
  const reqDocs=order.documents.filter(d=>req.includes(d.docId));
  const done=reqDocs.filter(d=>d.status==="Verified"||d.status==="Waived").length;
  return{done,total:req.length,pct:req.length?Math.round(done/req.length*100):0};
}

function DonutChart({segments,size=130}){
  const total=segments.reduce((s,d)=>s+d.v,0);
  if(!total)return null;
  const cx=size/2,cy=size/2,R=size*0.43,r=size*0.27;
  let angle=-Math.PI/2;
  const paths=segments.map(d=>{
    const sweep=(d.v/total)*2*Math.PI;
    const end=angle+sweep;
    const lg=sweep>Math.PI?1:0;
    const [c1,s1,c2,s2]=[Math.cos(angle),Math.sin(angle),Math.cos(end),Math.sin(end)];
    const path=`M${cx+R*c1} ${cy+R*s1} A${R} ${R} 0 ${lg} 1 ${cx+R*c2} ${cy+R*s2} L${cx+r*c2} ${cy+r*s2} A${r} ${r} 0 ${lg} 0 ${cx+r*c1} ${cy+r*s1}Z`;
    angle=end;
    return{...d,path};
  });
  return(
    <svg width={size} height={size} style={{flexShrink:0}}>
      {paths.map(p=><path key={p.label} d={p.path} fill={p.color} stroke="#fff" strokeWidth={2}/>)}
      <text x={cx} y={cy-5} textAnchor="middle" fontSize={size*0.18} fontWeight={600} fill="#0f172a" fontFamily="DM Sans,sans-serif">{total}</text>
      <text x={cx} y={cy+11} textAnchor="middle" fontSize={size*0.08} fill="#94a3b8" fontFamily="JetBrains Mono,monospace" letterSpacing="0.08em">ORDERS</text>
    </svg>
  );
}

function expiryState(validUntil){
  if(!validUntil)return null;
  const days=Math.round((new Date(validUntil)-new Date())/86400000);
  if(days<0)return{label:`Expired ${Math.abs(days)}d ago`,short:"Expired",color:"#dc2626",bg:"#fee2e2"};
  if(days===0)return{label:"Expires today",short:"Today",color:"#dc2626",bg:"#fee2e2"};
  if(days<=30)return{label:`Expires in ${days}d`,short:`${days}d`,color:"#d97706",bg:"#fef3c7"};
  return{label:`Valid until ${validUntil}`,short:validUntil,color:"#16a34a",bg:"#dcfce7"};
}

function Sparkline({data,height=52,color="#2563eb"}){
  if(!data||data.length===0)return null;
  const max=Math.max(...data.map(d=>d.v),1);
  const barW=22,gap=6,labelH=14,valH=12;
  const W=data.length*(barW+gap)-gap;
  const chartH=height-labelH-valH;
  return(
    <svg width={W} height={height} style={{overflow:"visible"}}>
      {data.map((d,i)=>{
        const h=d.v>0?Math.max(3,Math.round((d.v/max)*chartH)):2;
        const x=i*(barW+gap);
        const y=valH+chartH-h;
        return(
          <g key={d.label}>
            <rect x={x} y={y} width={barW} height={h} rx={3} fill={color} opacity={d.v>0?.8:.2}/>
            {d.v>0&&<text x={x+barW/2} y={y-3} textAnchor="middle" fontSize={9} fill="#475569" fontFamily="JetBrains Mono,monospace">{d.v}d</text>}
            <text x={x+barW/2} y={height} textAnchor="middle" fontSize={9} fill="#94a3b8" fontFamily="JetBrains Mono,monospace">{d.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

          <tbody>
            {loading
              ?<tr><td colSpan={6} style={{padding:"32px",textAlign:"center",color:"#94a3b8",fontSize:13}}>Loading&#x2026;</td></tr>
              :filtered.length===0
                ?<tr><td colSpan={6} style={{padding:"32px",textAlign:"center",color:"#94a3b8",fontSize:13}}>No orders found</td></tr>
                :filtered.map((o,i)=>{
                  const last=i===filtered.length-1;
                  return(
                    <tr key={o.order_number} className={`dt-tr-click${last?" dt-tr-last":""}`} onClick={()=>onSelect(o.order_number)}>
                      <td className="dt-td mono" style={{fontSize:11,color:"#2563eb"}}>{o.order_number}</td>
                      <td className="dt-td" style={{fontWeight:500}}>{o.customer_name}</td>
                      <td className="dt-td" style={{fontSize:12,color:"#64748b"}}>{o.destination_country||"&#x2014;"}</td>
                      <td className="dt-td"><Progress pct={o.progress_pct||0}/></td>
                      <td className="dt-td"><Badge label={o.status||"New"} cfg={ORDER_BADGE}/></td>
                      <td className="dt-td"><i className="ti ti-chevron-right" style={{fontSize:13,color:"#94a3b8"}}/></td>
                    </tr>
                  );
                })
            }
          </tbody>
        </table>
      </div>
    </div>
  );
}

function OrderDetail({orderId,currentUser,onBack,showToast}){
  const[order,setOrder]=useState(null);
  const[items,setItems]=useState([]);
  const[activity,setActivity]=useState([]);
  const[shipmentEvents,setShipmentEvents]=useState([]);
  const[loading,setLoading]=useState(true);
  const[isSeed,setIsSeed]=useState(false);
  const[editId,setEditId]=useState(null);
  const[editStatus,setEditStatus]=useState('');
  const[editNotes,setEditNotes]=useState('');
  const[editExpiry,setEditExpiry]=useState('');
  const[editSigReq,setEditSigReq]=useState(false);
  const[requestingSig,setRequestingSig]=useState(null);
  const ro=!canEdit(currentUser.role);
  const[uploading,setUploading]=useState(null);
  const[uploadTarget,setUploadTarget]=useState(null);
  const fileInputRef=useRef(null);
  const[addingEvent,setAddingEvent]=useState(false);
  const[newEvType,setNewEvType]=useState(SHIPMENT_MILESTONES[0].type);
  const[newEvDate,setNewEvDate]=useState('');
  const[newEvNotes,setNewEvNotes]=useState('');
  const[savingEvent,setSavingEvent]=useState(false);

  useEffect(()=>{load();},[orderId]);

  async function load(){
    setLoading(true);
    const{data:sbOrder}=await sb.from('orders').select('*').eq('order_number',orderId).maybeSingle();
    if(sbOrder){
      const[{data:sbItems},{data:sbAct},{data:sbEvs}]=await Promise.all([
        sb.from('checklist_items').select('*').eq('order_number',orderId).order('category'),
        sb.from('order_activity').select('*').eq('order_number',orderId).order('created_at',{ascending:false}).limit(50),
        sb.from('shipment_events').select('*').eq('order_number',orderId).order('event_date',{ascending:true})
      ]);
      setOrder(sbOrder);setItems(sbItems||[]);setActivity(sbAct||[]);setShipmentEvents(sbEvs||[]);setIsSeed(false);
    } else {
      const seed=SEED_ORDERS.find(o=>o.id===orderId);
      if(seed){
        const ot=SEED_ORDER_TYPES.find(t=>t.id===seed.orderTypeId);
        setOrder({order_number:seed.id,customer_name:seed.customer,destination_country:null,status:seed.orderStatus,progress_pct:ot?getProgress(seed,ot).pct:0,created_at:seed.createdAt,due_date:seed.dueDate,ref:seed.ref});
        setItems(ot?ot.docs.map(def=>{const ds=seed.documents.find(d=>d.docId===def.id)||{status:"Pending",notes:""};return{id:def.id,document_type:def.name,category:def.category||"—",condition:def.required?"Always":"Conditional",status:ds.status,notes:ds.notes||""};}):[]);
        setIsSeed(true);
      }
      setActivity([]);setShipmentEvents([]);
    }
    setLoading(false);
  }

  async function logActivity(action,detail){
    if(isSeed)return;
    await sb.from('order_activity').insert({
      order_number:order.order_number,
      user_email:currentUser?.email||currentUser?.username||'unknown',
      action,detail
    });
    const{data:fresh}=await sb.from('order_activity').select('*').eq('order_number',order.order_number).order('created_at',{ascending:false}).limit(50);
    if(fresh)setActivity(fresh);
  }

  async function generateShare(){
    if(isSeed){showToast("Demo orders can't be shared",false);return;}
    let token=order.share_token;
    if(!token){
      token=crypto.randomUUID();
      const{error}=await sb.from('orders').update({share_token:token}).eq('order_number',order.order_number);
      if(error){showToast('Failed to generate share link: '+error.message,false);return;}
      setOrder(p=>({...p,share_token:token}));
    }
    const url=`${location.origin}${location.pathname}?share=${token}`;
    try{await navigator.clipboard.writeText(url);showToast('Share link copied to clipboard');}
    catch{showToast('Share link: '+url);}
  }

  async function addShipmentEvent(){
    if(!newEvDate||isSeed)return;
    setSavingEvent(true);
    const{error}=await sb.from('shipment_events').insert({
      order_number:order.order_number,
      event_type:newEvType,
      event_date:newEvDate,
      notes:newEvNotes||null,
      created_by:currentUser?.email||currentUser?.username||'unknown'
    });
    if(error){showToast('Failed to add event: '+error.message,false);setSavingEvent(false);return;}
    const{data:fresh}=await sb.from('shipment_events').select('*').eq('order_number',order.order_number).order('event_date',{ascending:true});
    if(fresh)setShipmentEvents(fresh);
    setAddingEvent(false);setNewEvDate('');setNewEvNotes('');setNewEvType(SHIPMENT_MILESTONES[0].type);
    showToast('Milestone added');setSavingEvent(false);
  }

  function startEdit(item){
    setEditId(item.id);
    setEditStatus(item.status||'Pending');
    setEditNotes(item.notes||'');
    setEditExpiry(item.valid_until||'');
    setEditSigReq(!!item.signature_required);
  }

  async function saveOverride(item){
    const patch={status:editStatus,notes:editNotes,valid_until:editExpiry||null,signature_required:editSigReq};
    if(!isSeed){
      const{error}=await sb.from('checklist_items').update(patch).eq('id',item.id);
      if(error){showToast('Save failed: '+error.message,false);return;}
    }
    await logActivity('override',{doc_type:item.document_type,from:item.status,to:editStatus,notes:editNotes,expiry:editExpiry||null});
    setItems(p=>p.map(i=>i.id===item.id?{...i,...patch}:i));
    setEditId(null);showToast('Document updated');
  }

  async function submitDoc(item){
    if(!isSeed){await sb.from('checklist_items').update({status:'Received'}).eq('id',item.id);}
    await logActivity('submit',{doc_type:item.document_type});
    setItems(p=>p.map(i=>i.id===item.id?{...i,status:'Received'}:i));
    showToast('Document submitted');
  }

  async function openDoc(item){
    const folder=(item.category||'').trim().replace(/ /g,'_');
    const docName=(item.document_type||item.doc_type||'').trim().replace(/ /g,'_');
    const storagePath=`${order.order_number}/${folder}/${docName}_${order.order_number}.pdf`;
    const{data,error}=await sb.storage.from('documents').createSignedUrl(storagePath,3600);
    if(error||!data?.signedUrl){showToast('Document not available in storage',false);return;}
    window.open(data.signedUrl,'_blank');
  }

  async function updateOrderStatus(newStatus){
    if(!isSeed){
      const{error}=await sb.from('orders').update({status:newStatus,ready_to_ship:newStatus==="Complete"}).eq('order_number',order.order_number);
      if(error){showToast('Failed to update status',false);return;}
    }
    await logActivity('order_status',{from:order.status,to:newStatus});
    setOrder(p=>({...p,status:newStatus,ready_to_ship:newStatus==="Complete"}));
    showToast('Order status updated');
  }

  async function requestSig(item){
    if(isSeed){showToast('Not available for demo orders',false);return;}
    setRequestingSig(item.id);
    try{
      const res=await fetch('https://ramanathan999.app.n8n.cloud/webhook/request-signature',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({item_id:item.id,order_number:order.order_number,destination_country:order.destination_country||''})
      });
      if(!res.ok)throw new Error(`HTTP ${res.status}`);
      setItems(p=>p.map(i=>i.id===item.id?{...i,signature_status:'signed',signed_at:new Date().toISOString()}:i));
      showToast('Document signed successfully');
    }catch(e){showToast('Signature request failed — check n8n workflow',false);}
    setRequestingSig(null);
  }

  function triggerUpload(item){setUploadTarget(item);fileInputRef.current.click();}

  async function handleFileSelect(e){
    const file=e.target.files[0];
    e.target.value='';
    if(!file||!uploadTarget)return;
    const item=uploadTarget;
    const folder=(item.category||'').trim().replace(/ /g,'_');
    const docName=(item.document_type||item.doc_type||'').trim().replace(/ /g,'_');
    const storagePath=`${order.order_number}/${folder}/${docName}_${order.order_number}.pdf`;
    setUploading(item.id);
    const{error}=await sb.storage.from('documents').upload(storagePath,file,{contentType:'application/pdf',upsert:true});
    if(error){showToast('Upload failed: '+error.message,false);}
    else{
      await logActivity('upload',{doc_type:item.document_type,path:storagePath});
      if(!['Verified','Waived','Complete'].includes(item.status)&&!isSeed){
        await sb.from('checklist_items').update({status:'Received'}).eq('id',item.id);
        setItems(p=>p.map(i=>i.id===item.id?{...i,status:'Received'}:i));
      }
      showToast('Document uploaded');
    }
    setUploading(null);setUploadTarget(null);
  }

  if(loading)return<div style={{padding:40,textAlign:'center',color:'#94a3b8'}}>Loading&#x2026;</div>;
  if(!order)return<div style={{padding:40,textAlign:'center',color:'#94a3b8'}}>Order not found.</div>;

  const reqItems=items.filter(i=>!i.condition||i.condition==='Always');
  const reqDone=reqItems.filter(i=>i.status==='Verified'||i.status==='Waived'||i.status==='Complete').length;
  const reqTotal=reqItems.length||items.length;
  const pct=reqTotal>0?Math.round(reqDone/reqTotal*100):(order.progress_pct||0);

  return(
    <div>
      <input ref={fileInputRef} type="file" accept=".pdf" style={{display:"none"}} onChange={handleFileSelect}/>
      <button className="dt-back-btn" onClick={onBack}><i className="ti ti-arrow-left"/> Back to orders</button>
      <div className="dt-card" style={{padding:"16px 20px",marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12,flexWrap:"wrap"}}>
          <div>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,flexWrap:"wrap"}}>
              <span className="mono" style={{fontSize:12,color:"#2563eb"}}>{order.order_number}</span>
              {ro
                ?<Badge label={order.status||"New"} cfg={ORDER_BADGE}/>
                :<select value={order.status||"New"} onChange={e=>updateOrderStatus(e.target.value)} style={{fontSize:12,padding:"2px 8px",width:"auto",borderRadius:5}}>
                  {ORDER_STATUSES.map(s=><option key={s} value={s}>{s}</option>)}
                </select>
              }
            </div>
            <div style={{fontSize:18,fontWeight:500,color:"#0f172a",marginBottom:6}}>{order.customer_name}</div>
            <div className="dt-order-meta">
              {order.ref&&<span><i className="ti ti-hash"/>{order.ref}</span>}
              {order.destination_country&&<span><i className="ti ti-map-pin"/>{order.destination_country}</span>}
              {order.incoterms&&<span><i className="ti ti-tag"/>{order.incoterms}</span>}
              {order.created_at&&<span><i className="ti ti-calendar"/>Created {String(order.created_at).slice(0,10)}</span>}
              {order.due_date&&<span><i className="ti ti-clock"/>Due {order.due_date}</span>}
            </div>
          </div>
          <div style={{textAlign:"right",flexShrink:0}}>
            <div style={{fontSize:11,color:"#64748b",marginBottom:3}}>Required docs complete</div>
            <div style={{fontSize:24,fontWeight:500,color:pct===100?"#15803d":"#0f172a"}}>{reqDone}/{reqTotal}</div>
            <Progress pct={pct}/>
            {!isSeed&&<button onClick={generateShare} style={{marginTop:8,fontSize:11,display:"flex",alignItems:"center",gap:4,color:"#2563eb",background:"none",border:"none",cursor:"pointer",padding:0,fontFamily:"'DM Sans',sans-serif",marginLeft:"auto"}}>
              <i className="ti ti-share" style={{fontSize:13}}/>{order.share_token?"Copy share link":"Generate share link"}
            </button>}
          </div>
        </div>
      </div>
      <div className="dt-card">
        <div className="dt-section-hdr">
          Document checklist
          {ro&&<span className="dt-ro-label"><i className="ti ti-eye"/>Read-only</span>}
        </div>
        {pct===0&&items.length>0&&(
          <div style={{padding:"12px 16px",background:"#eff6ff",borderBottom:"1px solid #dbeafe",display:"flex",alignItems:"flex-start",gap:12}}>
            <i className="ti ti-info-circle" style={{fontSize:18,color:"#2563eb",marginTop:1,flexShrink:0}}/>
            <div>
              <div style={{fontSize:12,fontWeight:500,color:"#1e40af",marginBottom:3}}>Getting started — {items.length} documents to collect</div>
              <div style={{fontSize:12,color:"#3b82f6",lineHeight:1.6}}>Use the <strong>green upload button</strong> to attach PDFs directly, or the <strong>pencil icon</strong> to manually set a document status.</div>
            </div>
          </div>
        )}
        <table className="dt-table">
          <thead><tr>
            <th className="dt-th">Category</th>
            <th className="dt-th">Document</th>
            <th className="dt-th">Status</th>
            <th className="dt-th">File</th>
            {!ro&&<th className="dt-th">Actions</th>}
          </tr></thead>
          <tbody>
            {items.length===0
              ?<tr><td colSpan={5} style={{padding:"32px",textAlign:"center",color:"#94a3b8",fontSize:13}}>No documents found</td></tr>
              :items.map((item,i)=>{
                const last=i===items.length-1;
                const editing=editId===item.id;
                const docLabel=item.document_type||item.doc_type||"—";
                return(
                  <tr key={item.id} className={last?"dt-tr-last":""} style={editing?{background:"#fafafa"}:{}}>
                    <td className="dt-td" style={{fontSize:12,color:"#64748b"}}>{item.category||"—"}</td>
                    <td className="dt-td" style={{fontWeight:500}}>
                      <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                        {docLabel}
                        {item.signature_required&&(item.signature_status==='signed'
                          ?<span className="dt-sig-badge" style={{background:'#dcfce7',color:'#15803d'}}><i className="ti ti-check" style={{fontSize:10}}/>Signed</span>
                          :item.signature_status==='requested'
                            ?<span className="dt-sig-badge" style={{background:'#fef3c7',color:'#b45309'}}><i className="ti ti-clock" style={{fontSize:10}}/>Sig. pending</span>
                            :<span className="dt-sig-badge" style={{background:'#ede9fe',color:'#7c3aed'}}><i className="ti ti-pencil-check" style={{fontSize:10}}/>Needs sig.</span>
                        )}
                      </div>
                      {(()=>{const exp=expiryState(item.valid_until);return exp&&exp.short!==item.valid_until?(<div style={{marginTop:3}}><span style={{fontSize:10,fontWeight:500,color:exp.color,background:exp.bg,padding:"1px 6px",borderRadius:3,display:"inline-flex",alignItems:"center",gap:4}}><i className="ti ti-calendar-x" style={{fontSize:10}}/>{exp.short}</span></div>):null;})()}
                    </td>
                    <td className="dt-td">
                      {editing
                        ?<select value={editStatus} onChange={e=>setEditStatus(e.target.value)} style={{width:110,fontSize:12,padding:"4px 7px"}}>
                          {DOC_STATUSES.map(s=><option key={s} value={s}>{s}</option>)}
                        </select>
                        :<div style={{display:"flex",alignItems:"center",gap:6}}>
                          <Badge label={item.status||"Pending"} cfg={DOC_BADGE}/>
                          {!ro&&<button onClick={()=>startEdit(item)} title="Override status" style={{background:"none",border:"none",padding:"2px 3px",cursor:"pointer",display:"flex",alignItems:"center",color:"#94a3b8"}}>
                            <i className="ti ti-pencil" style={{fontSize:13}}/>
                          </button>}
                        </div>
                      }
                    </td>
                    <td className="dt-td">
                      <div style={{display:"flex",alignItems:"center",gap:2}}>
                        <button onClick={()=>openDoc(item)} title="Open document" style={{background:"none",border:"none",padding:"2px 4px",cursor:"pointer",display:"flex",alignItems:"center",fontSize:12}}>
                          <i className="ti ti-file-download" style={{fontSize:16,color:"#2563eb"}}/>
                        </button>
                        {!ro&&!isSeed&&(
                          <button onClick={()=>triggerUpload(item)} title="Upload PDF" disabled={uploading===item.id} style={{background:"none",border:"none",padding:"2px 4px",cursor:"pointer",display:"flex",alignItems:"center",fontSize:12,opacity:uploading===item.id?.5:1}}>
                            {uploading===item.id
                              ?<i className="ti ti-loader-2" style={{fontSize:16,color:"#94a3b8"}}/>
                              :<i className="ti ti-upload" style={{fontSize:16,color:"#16a34a"}}/>}
                          </button>
                        )}
                      </div>
                    </td>
                    {!ro&&<td className="dt-td">
                      {editing?(
                        <div style={{display:"flex",gap:6,alignItems:"center"}}>
                          <input value={editNotes} onChange={e=>setEditNotes(e.target.value)} placeholder="Notes…" style={{fontSize:11,padding:"3px 6px",width:110}}/>
                          <input type="date" value={editExpiry} onChange={e=>setEditExpiry(e.target.value)} title="Expiry date" style={{fontSize:11,padding:"3px 6px",width:120}}/>
                          <label style={{display:"flex",alignItems:"center",gap:3,fontSize:11,color:"#64748b",cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}}>
                            <input type="checkbox" checked={editSigReq} onChange={e=>setEditSigReq(e.target.checked)} style={{width:"auto"}}/>Sig. req.
                          </label>
                          <button onClick={()=>saveOverride(item)} className="dt-btn-primary" style={{fontSize:11,padding:"4px 10px"}}>Save</button>
                          <button onClick={()=>setEditId(null)} style={{fontSize:11,padding:"4px 10px"}}>Cancel</button>
                        </div>
                      ):(
                        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                          {item.status!=="Verified"&&item.status!=="Waived"&&item.status!=="Complete"&&(
                            <button onClick={()=>submitDoc(item)} style={{fontSize:11,padding:"4px 10px",display:"flex",alignItems:"center",gap:4,background:"#dbeafe",borderColor:"#bfdbfe",color:"#1d4ed8"}}>
                              <i className="ti ti-send"/>Submit
                            </button>
                          )}
                          {item.signature_required&&item.signature_status!=='signed'&&(
                            <button onClick={()=>requestSig(item)} disabled={requestingSig===item.id} style={{fontSize:11,padding:"4px 10px",display:"flex",alignItems:"center",gap:4,background:"#ede9fe",borderColor:"#ddd6fe",color:"#7c3aed",opacity:requestingSig===item.id?.6:1}}>
                              {requestingSig===item.id?<><i className="ti ti-loader-2"/>Sending…</>:<><i className="ti ti-pencil-check"/>Request sig.</>}
                            </button>
                          )}
                        </div>
                      )}
                    </td>}
                  </tr>
                );
              })
            }
          </tbody>
        </table>
      </div>

      {activity.length>0&&(
        <div className="dt-card" style={{marginTop:14}}>
          <div className="dt-section-hdr">Activity log</div>
          <div style={{padding:"14px 16px"}}>
            {activity.map((a,i)=>{
              const META={
                override:{icon:"ti-pencil",color:"#7c3aed"},
                upload:  {icon:"ti-upload", color:"#16a34a"},
                submit:  {icon:"ti-send",   color:"#2563eb"},
                order_status:{icon:"ti-refresh",color:"#d97706"},
              };
              const m=META[a.action]||{icon:"ti-circle",color:"#64748b"};
              const d=a.detail||{};
              const desc=a.action==='override'?`${d.doc_type}: ${d.from} → ${d.to}${d.notes?` — "${d.notes}"`:''}${d.expiry?` · expires ${d.expiry}`:''}`:
                         a.action==='upload'?`Uploaded ${d.doc_type}`:
                         a.action==='submit'?`Submitted ${d.doc_type}`:
                         a.action==='order_status'?`Order status: ${d.from} → ${d.to}`:
                         a.action;
              return(
                <div key={a.id} style={{display:"flex",gap:12,alignItems:"flex-start",paddingBottom:i===activity.length-1?0:12,marginBottom:i===activity.length-1?0:12,borderBottom:i===activity.length-1?"none":"1px solid #f1f5f9"}}>
                  <div style={{width:30,height:30,borderRadius:"50%",background:`${m.color}18`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1}}>
                    <i className={`ti ${m.icon}`} style={{fontSize:13,color:m.color}}/>
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,color:"#1e293b"}}>{desc}</div>
                    <div style={{fontSize:11,color:"#94a3b8",marginTop:2,display:"flex",gap:6}}>
                      <span>{a.user_email||"system"}</span>
                      <span>·</span>
                      <span>{new Date(a.created_at).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {!isSeed&&(
        <div className="dt-card" style={{marginTop:14}}>
          <div className="dt-section-hdr">
            Shipment timeline
            {!ro&&!addingEvent&&<button onClick={()=>setAddingEvent(true)} style={{fontSize:12,display:"flex",alignItems:"center",gap:4,color:"#2563eb",background:"none",border:"none",cursor:"pointer",padding:0,fontFamily:"'DM Sans',sans-serif"}}>
              <i className="ti ti-plus"/>Add milestone
            </button>}
          </div>
          <div style={{padding:"16px 18px"}}>
            {!ro&&addingEvent&&(
              <div style={{marginBottom:18,padding:"12px 14px",background:"#f8fafc",borderRadius:8,border:"1px solid #e2e8f0"}}>
                <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
                  <select value={newEvType} onChange={e=>setNewEvType(e.target.value)} style={{flex:"0 0 200px",fontSize:12}}>
                    {SHIPMENT_MILESTONES.map(m=><option key={m.type} value={m.type}>{m.type}</option>)}
                  </select>
                  <input type="date" value={newEvDate} onChange={e=>setNewEvDate(e.target.value)} style={{flex:"0 0 140px",fontSize:12}}/>
                  <input value={newEvNotes} onChange={e=>setNewEvNotes(e.target.value)} placeholder="Notes (optional)…" style={{flex:1,fontSize:12}}/>
                </div>
                <div style={{display:"flex",gap:6,justifyContent:"flex-end"}}>
                  <button onClick={()=>setAddingEvent(false)} style={{fontSize:12,padding:"4px 12px"}}>Cancel</button>
                  <button onClick={addShipmentEvent} disabled={!newEvDate||savingEvent} className="dt-btn-primary" style={{fontSize:12,padding:"4px 12px"}}>
                    {savingEvent?"Saving…":"Save"}
                  </button>
                </div>
              </div>
            )}
            {shipmentEvents.length===0&&!addingEvent

function CsvImportModal({onClose,onImported,showToast}){
  const[step,setStep]=useState('upload'); // upload | preview | importing | done
  const[rows,setRows]=useState([]);
  const[errors,setErrors]=useState([]);
  const[progress,setProgress]=useState(0);
  const fileRef=useRef(null);
  const REQUIRED_COLS=['customer','destination'];
  const OPTIONAL_COLS=['ref','incoterms','due_date'];

  function parseFile(e){
    const file=e.target.files[0];
    if(!file)return;
    Papa.parse(file,{
      header:true,skipEmptyLines:true,
      complete:({data,meta})=>{
        const missing=REQUIRED_COLS.filter(c=>!meta.fields.map(f=>f.toLowerCase().trim()).includes(c));
        if(missing.length>0){setErrors([`Missing required columns: ${missing.join(', ')}`]);return;}
        const normalised=data.map((r,i)=>{
          const norm={};
          Object.keys(r).forEach(k=>{norm[k.toLowerCase().trim()]=r[k];});
          return{...norm,_row:i+2};
        });
        const errs=[];
        normalised.forEach(r=>{
          if(!r.customer)errs.push(`Row ${r._row}: customer is empty`);
          if(!r.destination)errs.push(`Row ${r._row}: destination is empty`);
        });
        setErrors(errs);
        setRows(normalised);
        setStep('preview');
      },
      error:(err)=>setErrors([err.message])
    });
  }

  async function doImport(){
    const validRows=rows.filter(r=>r.customer&&r.destination);
    if(validRows.length===0){showToast('No valid rows to import',false);return;}
    setStep('importing');setProgress(0);
    const{count}=await sb.from('orders').select('*',{count:'exact',head:true});
    let base=count||0;
    let imported=0;
    for(const r of validRows){
      const orderNumber=`SHP-${new Date().getFullYear()}-${String(++base).padStart(3,'0')}`;
      const{data:newOrder,error}=await sb.from('orders').insert({
        order_number:orderNumber,
        customer_name:r.customer,
        destination_country:r.destination,
        incoterms:r.incoterms||'CIF',
        due_date:r.due_date||null,
        status:'New',
        progress_pct:0,
        ready_to_ship:false
      }).select().single();
      if(!error&&newOrder){
        const baseDocs=getRequiredDocs();
        const condDocs=await getConditionalDocs(r.destination,r.incoterms||'CIF');
        const docs=[...baseDocs,...condDocs];
        await sb.from('checklist_items').insert(docs.map(d=>({
          order_id:newOrder.id,
          order_number:orderNumber,
          category:d.category,
          document_type:d.docType,
          source:d.source,
          status:'Pending',
          signature_required:d.signatureRequired||false,
          expected:2,found:0
        })));
        imported++;
      }
      setProgress(Math.round((imported/validRows.length)*100));
    }
    setStep('done');
    showToast(`${imported} order${imported!==1?'s':''} imported`);
    onImported();
  }

  return(
    <ModalWrap title="Import orders from CSV" onClose={onClose}>
      {step==='upload'&&(
        <>
          <div style={{border:'2px dashed #e2e8f0',borderRadius:8,padding:'28px 20px',textAlign:'center',marginBottom:14,cursor:'pointer',background:'#fafafa'}} onClick={()=>fileRef.current.click()}>
            <i className="ti ti-file-spreadsheet" style={{fontSize:32,color:'#94a3b8',display:'block',marginBottom:8}}/>
            <div style={{fontSize:13,fontWeight:500,color:'#475569'}}>Click to choose a CSV file</div>
            <div style={{fontSize:11,color:'#94a3b8',marginTop:4}}>Required columns: <strong>customer</strong>, <strong>destination</strong></div>
            <div style={{fontSize:11,color:'#94a3b8'}}>Optional: ref, incoterms, due_date</div>
          </div>
          <input ref={fileRef} type="file" accept=".csv" style={{display:'none'}} onChange={parseFile}/>
          {errors.length>0&&<div style={{fontSize:12,color:'#b91c1c',background:'#fef2f2',border:'1px solid #fecaca',borderRadius:6,padding:'8px 10px',marginBottom:12}}>{errors.map((e,i)=><div key={i}>{e}</div>)}</div>}
          <div style={{fontSize:11,color:'#94a3b8',background:'#f8fafc',borderRadius:6,padding:'8px 10px',fontFamily:"'JetBrains Mono',monospace"}}>
            customer,destination,ref,incoterms,due_date<br/>
            "Acme Corp",Turkey,REF-001,CIF,2026-07-01
          </div>
          <div className="dt-modal-actions" style={{marginTop:14}}><button onClick={onClose}>Cancel</button></div>
        </>
      )}
      {step==='preview'&&(
        <>
          {errors.length>0&&<div style={{fontSize:12,color:'#b91c1c',background:'#fef2f2',border:'1px solid #fecaca',borderRadius:6,padding:'8px 10px',marginBottom:12}}>{errors.map((e,i)=><div key={i}>{e}</div>)}</div>}
          <div style={{fontSize:13,color:'#475569',marginBottom:10}}>{rows.filter(r=>r.customer&&r.destination).length} valid order{rows.filter(r=>r.customer&&r.destination).length!==1?'s':''} to import</div>
          <div style={{maxHeight:200,overflowY:'auto',border:'1px solid #e2e8f0',borderRadius:6,marginBottom:14}}>
            <table className="dt-table">
              <thead><tr><th className="dt-th">Customer</th><th className="dt-th">Destination</th><th className="dt-th">Incoterms</th><th className="dt-th">Due date</th></tr></thead>
              <tbody>
                {rows.slice(0,20).map((r,i)=>(<tr key={i} className={i===Math.min(rows.length,20)-1?'dt-tr-last':''}><td className="dt-td">{r.customer||<span style={{color:'#dc2626'}}>missing</span>}</td><td className="dt-td">{r.destination||<span style={{color:'#dc2626'}}>missing</span>}</td><td className="dt-td" style={{color:'#64748b'}}>{r.incoterms||'CIF'}</td><td className="dt-td mono" style={{fontSize:11,color:'#64748b'}}>{r.due_date||'—'}</td></tr>))}
              </tbody>
            </table>
          </div>
          <div className="dt-modal-actions">
            <button onClick={()=>{setStep('upload');setErrors([]);setRows([]);}}>Back</button>
            <button onClick={doImport} disabled={rows.filter(r=>r.customer&&r.destination).length===0} className="dt-btn-primary">Import {rows.filter(r=>r.customer&&r.destination).length} orders</button>
          </div>
        </>
      )}
      {step==='importing'&&(
        <div style={{textAlign:'center',padding:'20px 0'}}>
          <i className="ti ti-loader-2" style={{fontSize:28,color:'#2563eb',display:'block',marginBottom:10}}/>
          <div style={{fontSize:13,color:'#475569',marginBottom:12}}>Importing orders&#x2026; {progress}%</div>
          <div style={{height:6,background:'#f1f5f9',borderRadius:3,overflow:'hidden'}}>
            <div style={{height:'100%',width:`${progress}%`,background:'#2563eb',transition:'width .3s',borderRadius:3}}/>
          </div>
        </div>
      )}
      {step==='done'&&(
        <div style={{textAlign:'center',padding:'20px 0'}}>
          <i className="ti ti-circle-check" style={{fontSize:36,color:'#16a34a',display:'block',marginBottom:10}}/>
          <div style={{fontSize:14,fontWeight:500,color:'#0f172a',marginBottom:16}}>Import complete</div>
          <button onClick={onClose} className="dt-btn-primary">Close</button>
        </div>
      )}
    </ModalWrap>
  );
}

function KVKSearch(){
  const[q,setQ]=useState("");
  const[results,setResults]=useState(null);
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState(null);

  async function doSearch(){
    if(!q.trim())return;
    setLoading(true);setError(null);setResults(null);
    try{
      const res=await fetch(`https://ramanathan999.app.n8n.cloud/webhook/kvk-search?naam=${encodeURIComponent(q.trim())}`);
      if(!res.ok)throw new Error(`Server returned ${res.status}`);
      const data=await res.json();
      setResults(data);
    }catch(e){setError(e.message||"Search failed");}
    setLoading(false);
  }

  const bedrijven=results?.bedrijven||[];
  return(
    <div>
      <div className="dt-filters" style={{marginBottom:16}}>
        <div className="dt-search-wrap">
          <i className="ti ti-search dt-search-icon"/>
          <input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doSearch()} placeholder="Search company name&#x2026;"/>
        </div>
        <button onClick={doSearch} className="dt-btn-primary" style={{whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:5}}>
          <i className="ti ti-building-store"/>Search KVK
        </button>
      </div>
      {error&&<div style={{padding:"12px 16px",background:"#fef2f2",border:"1px solid #fecaca",borderRadius:8,color:"#b91c1c",fontSize:13,marginBottom:16}}><i className="ti ti-alert-circle"/> {error}</div>}
      {loading&&<div style={{padding:"40px 0",textAlign:"center",color:"#94a3b8",fontSize:13}}>Searching&#x2026;</div>}
      {!loading&&results&&(
        <div className="dt-card">
          <div className="dt-section-hdr">{bedrijven.length>0?`${results.totaalResultaten??bedrijven.length} result${results.totaalResultaten!==1?"s":""}  — showing first ${bedrijven.length}`:"No results found"}</div>
          {bedrijven.length>0&&(
            <table className="dt-table">
              <thead><tr>
                <th className="dt-th">Company name</th>
                <th className="dt-th">KVK number</th>
                <th className="dt-th">Address</th>
                <th className="dt-th">Type</th>
              </tr></thead>
              <tbody>
                {bedrijven.map((b,i)=>{
                  const addr=b.adres||b.bezoekadres||b.postadres||{};
                  const street=[addr.straatnaam||addr.straat||"",addr.huisnummer||""].filter(Boolean).join(" ");
                  const addrStr=[street,addr.postcode||"",addr.plaats||addr.plaatsnaam||""].filter(Boolean).join(", ");
                  return(
                    <tr key={i} className={i===bedrijven.length-1?"dt-tr-last":""}>
                      <td className="dt-td" style={{fontWeight:500}}>{b.naam||b.handelsnaam||"&#x2014;"}</td>
                      <td className="dt-td mono" style={{fontSize:12,color:"#2563eb"}}>{b.kvkNummer||"&#x2014;"}</td>
                      <td className="dt-td" style={{fontSize:12,color:"#64748b"}}>{addrStr||"&#x2014;"}</td>
                      <td className="dt-td" style={{fontSize:12,color:"#64748b"}}>{b.type||b.rechtsvorm||"&#x2014;"}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
        </div>
      )}
      {!loading&&!results&&!error&&(
        <div style={{padding:"60px 0",textAlign:"center"}}>
          <i className="ti ti-building" style={{fontSize:42,color:"#e2e8f0",display:"block",marginBottom:12}}/>
          <div style={{fontSize:13,color:"#94a3b8"}}>Enter a company name to search the KVK Handelsregister</div>
          <div style={{fontSize:11,color:"#cbd5e1",marginTop:6}}>Powered by KVK test API via N8N</div>
        </div>
      )}
    </div>
  );
}

function SignatureRulesView({showToast}){
  const[rules,setRules]=useState([]);
  const[loading,setLoading]=useState(true);
  const[adding,setAdding]=useState(false);
  const[newRule,setNewRule]=useState({country:'',signer_name:'',signer_email:''});
  const ur=(k,v)=>setNewRule(p=>({...p,[k]:v}));

  useEffect(()=>{
    sb.from('signature_rules').select('*').order('country',{ascending:true,nullsFirst:false}).then(({data})=>{setRules(data||[]);setLoading(false);});
  },[]);

  async function addRule(){
    if(!newRule.signer_name.trim()||!newRule.signer_email.trim())return;
    const{data,error}=await sb.from('signature_rules').insert({
      country:newRule.country.trim()||null,
      signer_name:newRule.signer_name.trim(),
      signer_email:newRule.signer_email.trim()
    }).select().single();
    if(error){showToast('Failed: '+error.message,false);return;}
    setRules(p=>[...p,data].sort((a,b)=>{if(!a.country)return 1;if(!b.country)return -1;return a.country.localeCompare(b.country);}));
    setNewRule({country:'',signer_name:'',signer_email:''});
    setAdding(false);showToast('Signer rule added');
  }

  async function deleteRule(id){
    await sb.from('signature_rules').delete().eq('id',id);
    setRules(p=>p.filter(r=>r.id!==id));
    showToast('Rule removed');
  }

  if(loading)return<div style={{padding:40,textAlign:'center',color:'#94a3b8',fontSize:13}}>Loading…</div>;

  return(
    <div className="dt-card">
      <div className="dt-section-hdr">
        Signature rules — signer per country
        <button onClick={()=>setAdding(p=>!p)} style={{fontSize:12,display:'flex',alignItems:'center',gap:4,color:'#2563eb',background:'none',border:'none',cursor:'pointer',padding:0,fontFamily:"'DM Sans',sans-serif"}}>
          <i className={`ti ${adding?'ti-x':'ti-plus'}`}/>{adding?'Cancel':'Add rule'}
        </button>
      </div>
      {adding&&(
        <div style={{padding:'12px 16px',background:'#f8fafc',borderBottom:'1px solid #e2e8f0',display:'flex',gap:8,flexWrap:'wrap',alignItems:'flex-end'}}>
          <div style={{display:'flex',flexDirection:'column',gap:3}}>
            <label style={{fontSize:10,color:'#94a3b8',letterSpacing:'.05em',textTransform:'uppercase'}}>Country (blank = default fallback)</label>
            <input value={newRule.country} onChange={e=>ur('country',e.target.value)} placeholder="e.g. Turkey" style={{fontSize:12,width:150}}/>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:3,flex:1}}>
            <label style={{fontSize:10,color:'#94a3b8',letterSpacing:'.05em',textTransform:'uppercase'}}>Signer name</label>
            <input value={newRule.signer_name} onChange={e=>ur('signer_name',e.target.value)} placeholder="e.g. Turkey Compliance Team" style={{fontSize:12}}/>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:3,flex:1}}>
            <label style={{fontSize:10,color:'#94a3b8',letterSpacing:'.05em',textTransform:'uppercase'}}>Signer email</label>
            <input type="email" value={newRule.signer_email} onChange={e=>ur('signer_email',e.target.value)} placeholder="e.g. compliance@company.com" style={{fontSize:12}}/>
          </div>
          <button onClick={addRule} disabled={!newRule.signer_name||!newRule.signer_email} className="dt-btn-primary" style={{fontSize:12,padding:'6px 14px',alignSelf:'flex-end'}}>Add</button>
        </div>
      )}
      {rules.length===0&&!adding
        ?<div style={{padding:'32px',textAlign:'center',color:'#94a3b8',fontSize:13}}>No rules yet. Add a default signer first (leave country blank), then add country-specific overrides.</div>
        :<table className="dt-table">
          <thead><tr>
            <th className="dt-th">Country</th>
            <th className="dt-th">Signer name</th>
            <th className="dt-th">Signer email</th>
            <th className="dt-th"/>
          </tr></thead>
          <tbody>
            {rules.map((r,i)=>(
              <tr key={r.id} className={i===rules.length-1?'dt-tr-last':''}>
                <td className="dt-td">
                  {r.country
                    ?<span className="dt-badge" style={{background:'#f1f5f9',color:'#475569',fontSize:11}}>{r.country}</span>
                    :<span className="dt-badge" style={{background:'#dcfce7',color:'#15803d',fontSize:11}}>Default — all countries</span>}
                </td>
                <td className="dt-td" style={{fontWeight:500}}>{r.signer_name}</td>
                <td className="dt-td" style={{fontSize:12,color:'#64748b'}}>{r.signer_email}</td>
                <td className="dt-td" style={{textAlign:'right'}}>
                  <button onClick={()=>deleteRule(r.id)} style={{background:'none',border:'none',padding:'2px 6px',cursor:'pointer',color:'#dc2626',fontSize:13,display:'inline-flex',alignItems:'center'}}>
                    <i className="ti ti-trash" style={{fontSize:14}}/>
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      }
    </div>
  );
}

function CustomerPortalView({token}){
  const[customerName,setCustomerName]=useState(null);
  const[orders,setOrders]=useState([]);
  const[itemsByOrder,setItemsByOrder]=useState({});
  const[loading,setLoading]=useState(true);
  const[expanded,setExpanded]=useState(null);
  const[portalToast,setPortalToast]=useState(null);
  const[downloading,setDownloading]=useState(null);
  const showMsg=(msg,ok=true)=>{setPortalToast({msg,ok});setTimeout(()=>setPortalToast(null),3500);};

  useEffect(()=>{
    async function load(){
      const{data:portal}=await sb.from('customer_portals').select('customer_name').eq('portal_token',token).maybeSingle();
      if(!portal){setLoading(false);return;}
      setCustomerName(portal.customer_name);
      const cutoff=new Date();cutoff.setDate(cutoff.getDate()-90);
      const{data:ords}=await sb.from('orders').select('*').eq('customer_name',portal.customer_name).gte('created_at',cutoff.toISOString()).order('created_at',{ascending:false});
      setOrders(ords||[]);
      if(ords&&ords.length>0){
        const{data:its}=await sb.from('checklist_items').select('*').in('order_number',ords.map(o=>o.order_number));
        const map={};
        (its||[]).forEach(i=>{if(!map[i.order_number])map[i.order_number]=[];map[i.order_number].push(i);});
        setItemsByOrder(map);
        setExpanded(ords[0].order_number);
      }
      setLoading(false);
    }
    load();
  },[]);

  async function downloadDoc(item,orderNumber){
    setDownloading(item.id);
    const folder=(item.category||'').trim().replace(/ /g,'_');
    const docName=(item.document_type||'').trim().replace(/ /g,'_');
    const path=`${orderNumber}/${folder}/${docName}_${orderNumber}.pdf`;
    const{data,error}=await sb.storage.from('documents').createSignedUrl(path,3600);
    setDownloading(null);
    if(error||!data?.signedUrl){showMsg('Document not yet available for download',false);return;}
    window.open(data.signedUrl,'_blank');
  }

  if(loading)return<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#f1f5f9',fontSize:13,color:'#94a3b8'}}>Loading&#x2026;</div>;
  if(!customerName)return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#f1f5f9'}}>
      <div style={{textAlign:'center'}}>
        <i className="ti ti-link-off" style={{fontSize:40,color:'#e2e8f0',display:'block',marginBottom:12}}/>
        <div style={{fontSize:15,fontWeight:500,color:'#0f172a',marginBottom:4}}>Portal not found</div>
        <div style={{fontSize:13,color:'#94a3b8'}}>This portal link may have expired or been revoked.</div>
      </div>
    </div>
  );

  return(
    <div style={{minHeight:'100vh',background:'#f1f5f9',padding:'24px 16px',position:'relative'}}>
      <div style={{maxWidth:820,margin:'0 auto'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:20}}>
          <i className="ti ti-file-check" style={{fontSize:22,color:'#f97316'}}/>
          <div>
            <div style={{fontSize:15,fontWeight:500,color:'#0f172a'}}>DocTrack</div>
            <div style={{fontSize:9,color:'#94a3b8',fontFamily:"'JetBrains Mono',monospace",letterSpacing:'.1em'}}>CUSTOMER PORTAL</div>
          </div>
        </div>

        <div className="dt-card" style={{padding:'14px 20px',marginBottom:16,display:'flex',alignItems:'center',gap:12}}>
          <div className="dt-avatar" style={{width:36,height:36,fontSize:13,flexShrink:0}}>{customerName.slice(0,2).toUpperCase()}</div>
          <div>
            <div style={{fontSize:15,fontWeight:500,color:'#0f172a'}}>{customerName}</div>
            <div style={{fontSize:12,color:'#94a3b8'}}>{orders.length} order{orders.length!==1?'s':''} — last 90 days</div>
          </div>
        </div>

        {orders.length===0
          ?<div className="dt-card" style={{padding:'40px',textAlign:'center'}}>
            <i className="ti ti-clipboard-list" style={{fontSize:32,color:'#e2e8f0',display:'block',marginBottom:12}}/>
            <div style={{fontSize:13,color:'#94a3b8'}}>No orders in the last 90 days</div>
          </div>
          :orders.map(order=>{
            const items=itemsByOrder[order.order_number]||[];
            const isOpen=expanded===order.order_number;
            const done=items.filter(i=>['Verified','Waived','Complete'].includes(i.status)).length;
            const pct=items.length>0?Math.round(done/items.length*100):0;
            return(
              <div key={order.order_number} className="dt-card" style={{marginBottom:12}}>
                <div style={{padding:'14px 18px',cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,flexWrap:'wrap'}} onClick={()=>setExpanded(isOpen?null:order.order_number)}>
                  <div>
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4,flexWrap:'wrap'}}>
                      <span className="mono" style={{fontSize:11,color:'#2563eb'}}>{order.order_number}</span>
                      <Badge label={order.status||'New'} cfg={ORDER_BADGE}/>
                    </div>
                    <div style={{fontSize:14,fontWeight:500,color:'#0f172a',marginBottom:2}}>{order.customer_name}</div>
                    <div style={{fontSize:11,color:'#94a3b8',display:'flex',gap:10,flexWrap:'wrap'}}>
                      {order.destination_country&&<span><i className="ti ti-map-pin"/> {order.destination_country}</span>}
                      {order.incoterms&&<span>{order.incoterms}</span>}
                      {order.due_date&&<span>Due {order.due_date}</span>}
                    </div>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:14,flexShrink:0}}>
                    <div style={{textAlign:'right'}}>
                      <div style={{fontSize:11,color:'#64748b',marginBottom:2}}>Docs complete</div>
                      <div style={{fontSize:20,fontWeight:600,color:pct===100?'#15803d':'#0f172a',lineHeight:1}}>{done}/{items.length}</div>
                    </div>
                    <i className={`ti ${isOpen?'ti-chevron-up':'ti-chevron-down'}`} style={{fontSize:14,color:'#94a3b8'}}/>
                  </div>
                </div>
                {isOpen&&(
                  <div style={{borderTop:'1px solid #f1f5f9'}}>
                    <table className="dt-table">
                      <thead><tr>
                        <th className="dt-th">Document</th>
                        <th className="dt-th">Category</th>
                        <th className="dt-th">Status</th>
                        <th className="dt-th">Download</th>
                      </tr></thead>
                      <tbody>
                        {items.map((item,i)=>{
                          const last=i===items.length-1;
                          const available=['Verified','Received','Complete'].includes(item.status);
                          return(
                            <tr key={item.id} className={last?'dt-tr-last':''}>
                              <td className="dt-td" style={{fontWeight:500}}>{item.document_type||'—'}</td>
                              <td className="dt-td" style={{fontSize:12,color:'#64748b'}}>{item.category||'—'}</td>
                              <td className="dt-td"><Badge label={item.status||'Pending'} cfg={DOC_BADGE}/></td>
                              <td className="dt-td">
                                {available
                                  ?<button onClick={()=>downloadDoc(item,order.order_number)} disabled={downloading===item.id} style={{background:'none',border:'none',padding:'2px 4px',cursor:'pointer',display:'inline-flex',alignItems:'center',gap:4,fontSize:12,color:'#2563eb',opacity:downloading===item.id?.5:1,fontFamily:"'DM Sans',sans-serif"}}>
                                    {downloading===item.id?<i className="ti ti-loader-2" style={{fontSize:15}}/>:<i className="ti ti-file-download" style={{fontSize:15}}/>}
                                    {downloading===item.id?'Opening…':'Download'}
                                  </button>
                                  :<span style={{fontSize:12,color:'#cbd5e1'}}>Not yet available</span>}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            );
          })
        }
        <div style={{textAlign:'center',marginTop:20,fontSize:11,color:'#94a3b8'}}>
          Powered by DocTrack · Showing your active shipments only
        </div>
      </div>
      {portalToast&&<Toast toast={portalToast}/>}
    </div>
  );
}

function CustomerPortalsView({currentUser,showToast}){
  const[customers,setCustomers]=useState([]);
  const[portals,setPortals]=useState([]);
  const[loading,setLoading]=useState(true);

  useEffect(()=>{
    async function load(){
      const[{data:ords},{data:ps}]=await Promise.all([
        sb.from('orders').select('customer_name').order('customer_name'),
        sb.from('customer_portals').select('*')
      ]);
      const names=[...new Set((ords||[]).map(o=>o.customer_name).filter(Boolean))].sort();
      setCustomers(names);setPortals(ps||[]);setLoading(false);
    }
    load();
  },[]);

  async function generatePortal(name){
    const existing=portals.find(p=>p.customer_name===name);
    if(existing){
      await navigator.clipboard.writeText(`${location.origin}${location.pathname}?customer=${existing.portal_token}`);
      showToast('Portal link copied');return;
    }
    const token=crypto.randomUUID();
    const{error}=await sb.from('customer_portals').insert({portal_token:token,customer_name:name,created_by:currentUser?.email||currentUser?.username});
    if(error){showToast('Failed: '+error.message,false);return;}
    setPortals(p=>[...p,{portal_token:token,customer_name:name}]);
    await navigator.clipboard.writeText(`${location.origin}${location.pathname}?customer=${token}`);
    showToast('Portal created & link copied to clipboard');
  }

  async function revokePortal(name){
    const portal=portals.find(p=>p.customer_name===name);
    if(!portal)return;
    await sb.from('customer_portals').delete().eq('portal_token',portal.portal_token);
    setPortals(p=>p.filter(x=>x.customer_name!==name));
    showToast('Portal revoked');
  }

  if(loading)return<div style={{padding:40,textAlign:'center',color:'#94a3b8',fontSize:13}}>Loading&#x2026;</div>;

  return(
    <div className="dt-card">
      <div className="dt-section-hdr">
        Customer portals
        <span style={{fontSize:11,color:'#94a3b8',fontWeight:400}}>Generate a magic link per customer — no login required</span>
      </div>
      {customers.length===0
        ?<div style={{padding:'40px',textAlign:'center',color:'#94a3b8',fontSize:13}}>No customers yet — create orders first</div>
        :customers.map((name,i)=>{
          const portal=portals.find(p=>p.customer_name===name);
          const last=i===customers.length-1;
          return(
            <div key={name} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'11px 16px',borderBottom:last?'none':'1px solid #f1f5f9',gap:12,flexWrap:'wrap'}}>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <div className="dt-avatar" style={{flexShrink:0}}>{name.slice(0,2).toUpperCase()}</div>
                <div>
                  <div style={{fontSize:13,fontWeight:500,color:'#0f172a'}}>{name}</div>
                  <div style={{fontSize:11,color:portal?'#16a34a':'#94a3b8'}}>{portal?'Portal active':'No portal'}</div>
                </div>
              </div>
              <div style={{display:'flex',gap:6}}>
                <button onClick={()=>generatePortal(name)} style={{fontSize:12,display:'flex',alignItems:'center',gap:4,padding:'5px 12px',background:portal?'#dbeafe':'#f8fafc',border:`1px solid ${portal?'#bfdbfe':'#e2e8f0'}`,color:portal?'#1d4ed8':'#475569',borderRadius:6,cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>
                  <i className={`ti ${portal?'ti-link':'ti-plus'}`}/>{portal?'Copy link':'Generate portal'}
                </button>
                {portal&&<button onClick={()=>revokePortal(name)} style={{fontSize:12,padding:'5px 12px',color:'#b91c1c',background:'#fef2f2',border:'1px solid #fecaca',borderRadius:6,cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>Revoke</button>}
              </div>
            </div>
          );
        })
      }
    </div>
  );
}

function SharedView({token}){
  const[order,setOrder]=useState(null);
  const[items,setItems]=useState([]);
  const[loading,setLoading]=useState(true);

  useEffect(()=>{
    async function load(){
      const{data:ord}=await sb.from('orders').select('*').eq('share_token',token).maybeSingle();
      if(ord){
        const{data:its}=await sb.from('checklist_items').select('*').eq('order_number',ord.order_number).order('category');
        setOrder(ord);setItems(its||[]);
      }
      setLoading(false);
    }
    load();
  },[]);

  if(loading)return<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#f1f5f9',fontSize:13,color:'#94a3b8'}}>Loading&#x2026;</div>;
  if(!order)return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#f1f5f9'}}>
      <div style={{textAlign:'center'}}>
        <i className="ti ti-link-off" style={{fontSize:40,color:'#e2e8f0',display:'block',marginBottom:12}}/>
        <div style={{fontSize:15,fontWeight:500,color:'#0f172a',marginBottom:4}}>Share link not found</div>
        <div style={{fontSize:13,color:'#94a3b8'}}>This link may have expired or been revoked.</div>
      </div>
    </div>
  );

  const cats=[...new Set(items.map(i=>i.category||'General'))];
  const reqItems=items.filter(i=>!i.condition||i.condition==='Always');
  const reqDone=reqItems.filter(i=>['Verified','Waived','Complete'].includes(i.status)).length;
  const reqTotal=reqItems.length||items.length;
  const pct=reqTotal>0?Math.round(reqDone/reqTotal*100):0;

  return(
    <div style={{minHeight:'100vh',background:'#f1f5f9',padding:'24px 16px'}}>
      <div style={{maxWidth:720,margin:'0 auto'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:20}}>
          <i className="ti ti-file-check" style={{fontSize:22,color:'#f97316'}}/>
          <div>
            <div style={{fontSize:15,fontWeight:500,color:'#0f172a'}}>DocTrack</div>
            <div style={{fontSize:9,color:'#94a3b8',fontFamily:"'JetBrains Mono',monospace",letterSpacing:'.1em'}}>SHARED VIEW · READ-ONLY</div>
          </div>
        </div>

        <div className="dt-card" style={{padding:'16px 20px',marginBottom:14}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:12,flexWrap:'wrap'}}>
            <div>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6,flexWrap:'wrap'}}>
                <span className="mono" style={{fontSize:12,color:'#2563eb'}}>{order.order_number}</span>
                <Badge label={order.status||'New'} cfg={ORDER_BADGE}/>
              </div>
              <div style={{fontSize:18,fontWeight:500,color:'#0f172a',marginBottom:6}}>{order.customer_name}</div>
              <div className="dt-order-meta">
                {order.ref&&<span><i className="ti ti-hash"/>{order.ref}</span>}
                {order.destination_country&&<span><i className="ti ti-map-pin"/>{order.destination_country}</span>}
                {order.incoterms&&<span><i className="ti ti-tag"/>{order.incoterms}</span>}
                {order.due_date&&<span><i className="ti ti-clock"/>Due {order.due_date}</span>}
              </div>
            </div>
            <div style={{textAlign:'right',flexShrink:0}}>
              <div style={{fontSize:11,color:'#64748b',marginBottom:3}}>Docs complete</div>
              <div style={{fontSize:24,fontWeight:500,color:pct===100?'#15803d':'#0f172a'}}>{reqDone}/{reqTotal}</div>
              <Progress pct={pct}/>
            </div>
          </div>
        </div>

        <div className="dt-card" style={{marginBottom:24}}>
          <div className="dt-section-hdr">Document checklist <span className="dt-ro-label"><i className="ti ti-eye"/>Read-only</span></div>
          {cats.map(cat=>{
            const catItems=items.filter(i=>(i.category||'General')===cat);
            return(
              <div key={cat}>
                <div style={{padding:'8px 16px',background:'#f8fafc',borderBottom:'1px solid #f1f5f9',fontSize:11,fontWeight:600,color:'#475569',letterSpacing:'.05em',textTransform:'uppercase'}}>
                  {cat}
                </div>
                <table className="dt-table">
                  <tbody>
                    {catItems.map((item,i)=>{
                      const docLabel=item.document_type||item.doc_type||'—';
                      const last=i===catItems.length-1;
                      const exp=expiryState(item.valid_until);
                      return(
                        <tr key={item.id} className={last?'dt-tr-last':''}>
                          <td className="dt-td" style={{fontWeight:500}}>
                            {docLabel}
                            {exp&&exp.short!==item.valid_until&&<div style={{marginTop:2}}><span style={{fontSize:10,fontWeight:500,color:exp.color,background:exp.bg,padding:'1px 6px',borderRadius:3}}>{exp.short}</span></div>}
                          </td>
                          <td className="dt-td"><Badge label={item.status||'Pending'} cfg={DOC_BADGE}/></td>
                          {item.notes&&<td className="dt-td" style={{fontSize:11,color:'#94a3b8'}}>{item.notes}</td>}
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            );
          })}
        </div>

        <div style={{textAlign:'center',fontSize:11,color:'#94a3b8'}}>
          Powered by DocTrack · This link provides read-only access to this shipment checklist
        </div>
      </div>
    </div>
  );
}

/* ── Main App ── */
function App(){
  const[user,setUser]=useState(null);
  const[sessionLoading,setSessionLoading]=useState(true);
  const[view,setView]=useState("login");
  const[orderId,setOrderId]=useState(null);
  const[orders,setOrders]=useState(SEED_ORDERS);
  const[users,setUsers]=useState(SEED_USERS);
  const[orderTypes,setOrderTypes]=useState(SEED_ORDER_TYPES);
  const[toast,setToast]=useState(null);
  const[modal,setModal]=useState(null);
  const[sidebarOpen,setSidebarOpen]=useState(false);

  useEffect(()=>{
    function sbUserToAppUser(u){
      const role=u.user_metadata?.role||'viewer';
      return{id:u.id,name:u.user_metadata?.name||u.email,email:u.email,username:u.email,role,created:u.created_at?.slice(0,10)||''};
    }
    sb.auth.getSession().then(({data:{session}})=>{
      if(session){setUser(sbUserToAppUser(session.user));setView('dashboard');}
      setSessionLoading(false);
    });
    const{data:{subscription}}=sb.auth.onAuthStateChange((event,session)=>{
      if(event==='SIGNED_IN'&&session){setUser(sbUserToAppUser(session.user));setView('dashboard');}
      if(event==='SIGNED_OUT'){setUser(null);setView('login');}
    });
    return()=>subscription.unsubscribe();
  },[]);

  const showToast=(msg,ok=true)=>{setToast({msg,ok});setTimeout(()=>setToast(null),2800);};
  const nav=(v,oid)=>{setView(v);if(oid!==undefined)setOrderId(oid);setModal(null);};
  const login=(u)=>{setUser(u);setView("dashboard");};
  const logout=()=>{sb.auth.signOut();setUser(null);setView("login");setOrderId(null);};

  if(CUSTOMER_TOKEN) return <CustomerPortalView token={CUSTOMER_TOKEN}/>;
  if(SHARE_TOKEN) return <SharedView token={SHARE_TOKEN}/>;
  if(sessionLoading)return<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#f1f5f9',fontSize:13,color:'#94a3b8'}}>Loading&#x2026;</div>;
  if(!user) return <Login users={users} onLogin={login}/>;

  const titles={dashboard:"Dashboard",orders:"Orders","order-detail":orderId||"Order detail",users:"User management",types:"Order types","kvk-search":"KVK Company Search","signature-rules":"Signature rules","customer-portals":"Customer portals"};

  return(
    <div className="dt-app">
      <Sidebar user={user} view={view} onNav={v=>nav(v)} onLogout={logout} open={sidebarOpen} onClose={()=>setSidebarOpen(false)}/>
      {sidebarOpen&&<div onClick={()=>setSidebarOpen(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.35)",zIndex:99}}/>}
      <div className="dt-main">
        <div className="dt-topbar">
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <button className="dt-hamburger" onClick={()=>setSidebarOpen(p=>!p)}><i className="ti ti-menu-2" style={{fontSize:20}}/></button>
            <span className="dt-topbar-title">{titles[view]||""}</span>
          </div>
          <div style={{display:"flex",gap:8}}>
            {view==="orders"&&canEdit(user.role)&&<button onClick={()=>setModal("order")} style={{display:"flex",alignItems:"center",gap:5,fontSize:13}}><i className="ti ti-plus"/>New order</button>}
            {view==="users"&&canAdmin(user.role)&&<button onClick={()=>setModal("user")} style={{display:"flex",alignItems:"center",gap:5,fontSize:13}}><i className="ti ti-plus"/>New user</button>}
            {view==="types"&&canAdmin(user.role)&&<button onClick={()=>setModal("type")} style={{display:"flex",alignItems:"center",gap:5,fontSize:13}}><i className="ti ti-plus"/>New type</button>}
          </div>
        </div>
        <div className="dt-content">
          {view==="dashboard"&&<Dashboard onNav={(v,id)=>nav(v,id)}/>}
          {view==="orders"&&<OrdersList onSelect={id=>nav("order-detail",id)} showToast={showToast} canEdit={canEdit(user.role)}/>}
          {view==="order-detail"&&orderId&&(
            <OrderDetail orderId={orderId} currentUser={user} showToast={showToast} onBack={()=>nav("orders")}/>
          )}
          {view==="kvk-search"&&<KVKSearch/>}
          {view==="users"&&canAdmin(user.role)&&<UsersView users={users} onUpdate={(id,patch)=>{setUsers(p=>p.map(u=>u.id===id?{...u,...patch}:u));showToast("User updated");}}/>}
          {view==="types"&&canAdmin(user.role)&&<TypesView orderTypes={orderTypes} onAddDoc={(tid,doc)=>{setOrderTypes(p=>p.map(ot=>ot.id===tid?{...ot,docs:[...ot.docs,{id:`${ot.id}d${ot.docs.length+1}`,...doc}]}:ot));showToast("Document added");}}/>}
          {view==="signature-rules"&&canAdmin(user.role)&&<SignatureRulesView showToast={showToast}/>}
          {view==="customer-portals"&&canAdmin(user.role)&&<CustomerPortalsView currentUser={user} showToast={showToast}/>}
        </div>
      </div>

      {modal==="order"&&<CreateOrderModal users={users} onClose={()=>setModal(null)} onCreate={async f=>{
        const{count}=await sb.from('orders').select('*',{count:'exact',head:true});
        const year=new Date().getFullYear();
        const orderNumber=`SHP-${year}-${String((count||0)+1).padStart(3,'0')}`;
        const{data:newOrder,error}=await sb.from('orders').insert({
          order_number:orderNumber,
          customer_name:f.customer,
          destination_country:f.destination,
          incoterms:f.incoterms,
          ref:f.ref||null,
          due_date:f.dueDate||null,
          status:'New',
          progress_pct:0,
          ready_to_ship:false
        }).select().single();
        if(error){showToast('Failed to create order: '+error.message,false);return;}
        const baseDocs=getRequiredDocs();
        const condDocs=await getConditionalDocs(f.destination,f.incoterms);
        const docs=[...baseDocs,...condDocs];
        await sb.from('checklist_items').insert(docs.map(d=>({
          order_id:newOrder.id,
          order_number:orderNumber,
          category:d.category,
          document_type:d.docType,
          source:d.source,
          status:'Pending',
          signature_required:d.signatureRequired||false,
          expected:2,
          found:0
        })));
        setModal(null);
        nav('order-detail',orderNumber);
        showToast('Order created');
      }}/>}
      {modal==="user"&&<CreateUserModal onClose={()=>setModal(null)} onCreate={f=>{setUsers(p=>[...p,{...f,id:`u${p.length+1}`,created:toDay(),active:true}]);setModal(null);showToast("User created");}}/>}
      {modal==="type"&&<CreateTypeModal onClose={()=>setModal(null)} onCreate={f=>{setOrderTypes(p=>[...p,{...f,id:`ot${p.length+1}`,docs:[]}]);setModal(null);showToast("Order type created");}}/>}

      <Toast toast={toast}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
