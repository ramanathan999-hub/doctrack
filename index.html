                      const exp=expiryState(item.valid_until);
                      return(
                        <tr key={item.id} className={last?'dt-tr-last':''}>
                          <td className="dt-td" style={{fontWeight:500}}>
                            {docLabel}
                            {exp&&exp.short!==item.valid_until&&<div style={{marginTop:2}}><span style={{fontSize:10,fontWeight:500,color:exp.color,background:exp.bg,padding:'1px 6px',borderRadius:3}}>{exp.short}</span></div>}
                          </td>
                          <td className="dt-td" style={{textAlign:'right',whiteSpace:'nowrap'}}><Badge label={item.status||'Pending'} cfg={DOC_BADGE}/></td>
                          <td className="dt-td" style={{fontSize:11,color:'#94a3b8'}}>{item.notes||''}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            );
          })}
        </div>

        <div style={{textAlign:'center',fontSize:11,color:'#94a3b8'}}>
          Powered by DocTrack · This link provides read-only access to this shipment checklist
        </div>
      </div>
    </div>
  );
}

/* ── Security / 2FA Modal ── */
function SecurityModal({user,onClose}){
  const[mfaFactors,setMfaFactors]=useState(null);
  const[enrollData,setEnrollData]=useState(null);
  const[factorId,setFactorId]=useState(null);
  const[verifyCode,setVerifyCode]=useState('');
  const[loading,setLoading]=useState(true);
  const[verifying,setVerifying]=useState(false);
  const[msg,setMsg]=useState(null);
  const isOAuth=user.id&&!/^u\d+$/.test(user.id);

  useEffect(()=>{
    if(!isOAuth){setLoading(false);return;}
    sb.auth.mfa.listFactors().then(({data})=>{setMfaFactors(data?.totp||[]);setLoading(false);});
  },[]);

  async function startEnroll(){
    setLoading(true);
    const{data,error}=await sb.auth.mfa.enroll({factorType:'totp'});
    if(error){setMsg({ok:false,text:error.message});setLoading(false);return;}
    setFactorId(data.id);setEnrollData(data.totp);setLoading(false);
  }

  async function verifyEnroll(){
    setVerifying(true);
    const{data:ch}=await sb.auth.mfa.challenge({factorId});
    const{error}=await sb.auth.mfa.verify({factorId,challengeId:ch.id,code:verifyCode});
    if(error){setMsg({ok:false,text:error.message});setVerifying(false);return;}
    setEnrollData(null);setVerifyCode('');
    const{data}=await sb.auth.mfa.listFactors();
    setMfaFactors(data?.totp||[]);
    setMsg({ok:true,text:'Two-factor authentication enabled'});
    setVerifying(false);
  }

  async function unenroll(id){
    const{error}=await sb.auth.mfa.unenroll({factorId:id});
    if(error){setMsg({ok:false,text:error.message});return;}
    setMfaFactors(p=>p.filter(f=>f.id!==id));
    setMsg({ok:true,text:'Two-factor authentication removed'});
  }

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div className="dt-card" style={{width:"100%",maxWidth:440,padding:"24px 28px",margin:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
          <div style={{fontSize:15,fontWeight:600,color:"#0f172a"}}>Security settings</div>
          <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",color:"#94a3b8",fontSize:20}}><i className="ti ti-x"/></button>
        </div>
        {msg&&<div style={{padding:"8px 12px",borderRadius:6,background:msg.ok?"#dcfce7":"#fee2e2",color:msg.ok?"#15803d":"#b91c1c",fontSize:12,marginBottom:14}}>{msg.text}</div>}
        {!isOAuth
          ?<div style={{textAlign:"center",padding:"20px 0",color:"#94a3b8",fontSize:13}}>
              <i className="ti ti-shield-off" style={{fontSize:32,display:"block",marginBottom:8,color:"#e2e8f0"}}/>
              MFA is available for accounts signed in via Google OAuth.
            </div>
          :loading
            ?<div style={{textAlign:"center",padding:"24px",color:"#94a3b8"}}>Loading…</div>
            :enrollData
              ?<div>
                  <div style={{fontSize:13,fontWeight:500,color:"#0f172a",marginBottom:10}}>Scan with your authenticator app</div>
                  <div style={{textAlign:"center",margin:"10px 0"}}><img src={enrollData.qr_code} style={{width:180,height:180}}/></div>
                  <div style={{fontSize:11,color:"#64748b",marginBottom:12}}>Or enter manually: <code style={{background:"#f1f5f9",padding:"2px 6px",borderRadius:4,fontSize:10}}>{enrollData.secret}</code></div>
                  <div style={{display:"flex",gap:8}}>
                    <input value={verifyCode} onChange={e=>setVerifyCode(e.target.value.replace(/\D/g,'').slice(0,6))} placeholder="6-digit code" maxLength={6} style={{flex:1,fontSize:14,padding:"7px 10px",fontFamily:"'JetBrains Mono',monospace",letterSpacing:".2em"}} autoFocus/>
                    <button onClick={verifyEnroll} disabled={verifyCode.length!==6||verifying} className="dt-btn-primary" style={{fontSize:12,padding:"7px 14px"}}>{verifying?"Verifying…":"Verify"}</button>
                  </div>
                </div>
              :<div>
                  <div style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",borderRadius:8,background:"#f8fafc",border:"1px solid #e2e8f0",marginBottom:16}}>
                    <div style={{width:38,height:38,borderRadius:9,background:mfaFactors?.length?"#dcfce7":"#f1f5f9",display:"flex",alignItems:"center",justifyContent:"center"}}>
                      <i className={`ti ${mfaFactors?.length?"ti-shield-check":"ti-shield"}`} style={{fontSize:20,color:mfaFactors?.length?"#15803d":"#94a3b8"}}/>
                    </div>
                    <div>
                      <div style={{fontSize:13,fontWeight:500,color:"#0f172a"}}>Two-factor authentication</div>
                      <div style={{fontSize:11,color:mfaFactors?.length?"#15803d":"#64748b"}}>{mfaFactors?.length?"Enabled — your account is protected":"Not enabled"}</div>
                    </div>
                  </div>
                  {mfaFactors?.length
                    ?<button onClick={()=>unenroll(mfaFactors[0].id)} style={{width:"100%",fontSize:12,padding:"7px",color:"#dc2626",border:"1px solid #fecaca",borderRadius:6,background:"#fff",cursor:"pointer"}}>Remove two-factor authentication</button>
                    :<button onClick={startEnroll} className="dt-btn-primary" style={{width:"100%",fontSize:12,padding:"7px"}}>Enable two-factor authentication (TOTP)</button>
                  }
                </div>
        }
        <div style={{marginTop:16,paddingTop:14,borderTop:"1px solid #f1f5f9",display:"flex",gap:10,alignItems:"center"}}>
          <div className="dt-avatar" style={{width:28,height:28,fontSize:11}}>{(user.name||user.email||'?').slice(0,1).toUpperCase()}</div>
          <div><div style={{fontSize:12,color:"#0f172a"}}>{user.email||user.username}</div><div style={{fontSize:10,color:"#94a3b8"}}>Role: {user.role}</div></div>
        </div>
      </div>
    </div>
  );
}

/* ── Main App ── */
function App(){
  const[user,setUser]=useState(null);
  const[sessionLoading,setSessionLoading]=useState(true);
  const[view,setView]=useState("login");
  const[orderId,setOrderId]=useState(null);
  const[orders,setOrders]=useState(SEED_ORDERS);
  const[users,setUsers]=useState(SEED_USERS);
  const[orderTypes,setOrderTypes]=useState(SEED_ORDER_TYPES);
  const[toast,setToast]=useState(null);
  const[modal,setModal]=useState(null);
  const[sidebarOpen,setSidebarOpen]=useState(false);
  const[showSecurity,setShowSecurity]=useState(false);

  useEffect(()=>{
    function sbUserToAppUser(u){
      const role=u.user_metadata?.role||'viewer';
      return{id:u.id,name:u.user_metadata?.name||u.email,email:u.email,username:u.email,role,created:u.created_at?.slice(0,10)||''};
    }
    sb.auth.getSession().then(({data:{session}})=>{
      if(session){setUser(sbUserToAppUser(session.user));setView('dashboard');}
      setSessionLoading(false);
    });
    const{data:{subscription}}=sb.auth.onAuthStateChange((event,session)=>{
      if(event==='SIGNED_IN'&&session){setUser(sbUserToAppUser(session.user));setView('dashboard');}
      if(event==='SIGNED_OUT'){setUser(null);setView('login');}
    });
    return()=>subscription.unsubscribe();
  },[]);

  const showToast=(msg,ok=true)=>{setToast({msg,ok});setTimeout(()=>setToast(null),2800);};
  const nav=(v,oid)=>{setView(v);if(oid!==undefined)setOrderId(oid);setModal(null);};
  const login=(u)=>{setUser(u);setView("dashboard");};
  const logout=()=>{sb.auth.signOut();setUser(null);setView("login");setOrderId(null);};

  /* ── Session timeout: 30 min inactivity ── */
  const[timeoutWarning,setTimeoutWarning]=useState(false);
  const idleTimer=useRef(null);
  const warnTimer=useRef(null);
  useEffect(()=>{
    if(!user)return;
    const WARN=28*60*1000, LIMIT=30*60*1000;
    const reset=()=>{
      setTimeoutWarning(false);
      clearTimeout(idleTimer.current);clearTimeout(warnTimer.current);
      warnTimer.current=setTimeout(()=>setTimeoutWarning(true),WARN);
      idleTimer.current=setTimeout(()=>logout(),LIMIT);
    };
    const events=['mousemove','mousedown','keydown','touchstart','scroll'];
    events.forEach(e=>window.addEventListener(e,reset,{passive:true}));
    reset();
    return()=>{events.forEach(e=>window.removeEventListener(e,reset));clearTimeout(idleTimer.current);clearTimeout(warnTimer.current);};
  },[user]);

  if(CUSTOMER_TOKEN) return <CustomerPortalView token={CUSTOMER_TOKEN}/>;
  if(SHARE_TOKEN) return <SharedView token={SHARE_TOKEN}/>;
  if(sessionLoading)return<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#f1f5f9',fontSize:13,color:'#94a3b8'}}>Loading&#x2026;</div>;
  if(!user) return <Login users={users} onLogin={login}/>;

  const titles={dashboard:"Dashboard",orders:"Orders","order-detail":orderId||"Order detail",users:"User management",types:"Order types","country-doc-needs":"Country doc needs",integrations:"Integrations","kvk-search":"KVK Company Search","signature-rules":"Signature rules","customer-doc-rules":"Customer doc rules","customer-portals":"Customer portals"};

  return(
    <div className="dt-app">
      <Sidebar user={user} view={view} onNav={v=>nav(v)} onLogout={logout} open={sidebarOpen} onClose={()=>setSidebarOpen(false)} onSecurity={()=>setShowSecurity(true)}/>
      {sidebarOpen&&<div onClick={()=>setSidebarOpen(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.35)",zIndex:99}}/>}
      <div className="dt-main">
        <div className="dt-topbar">
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <button className="dt-hamburger" onClick={()=>setSidebarOpen(p=>!p)}><i className="ti ti-menu-2" style={{fontSize:20}}/></button>
            <span className="dt-topbar-title">{titles[view]||""}</span>
          </div>
          <div style={{display:"flex",gap:8}}>
            {view==="orders"&&canEdit(user.role)&&<button onClick={()=>setModal("order")} style={{display:"flex",alignItems:"center",gap:5,fontSize:13}}><i className="ti ti-plus"/>New order</button>}
            {view==="users"&&canAdmin(user.role)&&<button onClick={()=>setModal("user")} style={{display:"flex",alignItems:"center",gap:5,fontSize:13}}><i className="ti ti-plus"/>New user</button>}
            {view==="types"&&canAdmin(user.role)&&<button onClick={()=>setModal("type")} style={{display:"flex",alignItems:"center",gap:5,fontSize:13}}><i className="ti ti-plus"/>New type</button>}
          </div>
        </div>
        <div className="dt-content">
          {view==="dashboard"&&<Dashboard onNav={(v,id)=>nav(v,id)}/>}
          {view==="orders"&&<OrdersList onSelect={id=>nav("order-detail",id)} showToast={showToast} canEdit={canEdit(user.role)}/>}
          {view==="order-detail"&&orderId&&(
            <OrderDetail orderId={orderId} currentUser={user} showToast={showToast} onBack={()=>nav("orders")}/>
          )}
          {view==="integrations"&&<IntegrationsView/>}
          {view==="kvk-search"&&<KVKSearch/>}
          {view==="users"&&canAdmin(user.role)&&<UsersView users={users} onUpdate={(id,patch)=>{setUsers(p=>p.map(u=>u.id===id?{...u,...patch}:u));showToast("User updated");}}/>}
          {view==="types"&&canAdmin(user.role)&&<TypesView orderTypes={orderTypes} onAddDoc={(tid,doc)=>{setOrderTypes(p=>p.map(ot=>ot.id===tid?{...ot,docs:[...ot.docs,{id:`${ot.id}d${ot.docs.length+1}`,...doc}]}:ot));showToast("Document added");}}/>}
          {view==="country-doc-needs"&&canAdmin(user.role)&&<CountryDocNeedsView showToast={showToast}/>}
          {view==="signature-rules"&&canAdmin(user.role)&&<SignatureRulesView showToast={showToast}/>}
          {view==="customer-doc-rules"&&canAdmin(user.role)&&<CustomerDocRulesView showToast={showToast}/>}
          {view==="customer-portals"&&canAdmin(user.role)&&<CustomerPortalsView currentUser={user} showToast={showToast}/>}
        </div>
      </div>

      {modal==="order"&&<CreateOrderModal users={users} onClose={()=>setModal(null)} onCreate={async f=>{
        const{count}=await sb.from('orders').select('*',{count:'exact',head:true});
        const year=new Date().getFullYear();
        const orderNumber=`SHP-${year}-${String((count||0)+1).padStart(3,'0')}`;
        const{data:newOrder,error}=await sb.from('orders').insert({
          order_number:orderNumber,
          customer_name:f.customer,
          destination_country:f.destination,
          incoterms:f.incoterms,
          ref:f.ref||null,
          due_date:f.dueDate||null,
          status:'New',
          progress_pct:0,
          ready_to_ship:false
        }).select().single();
        if(error){showToast('Failed to create order: '+error.message,false);return;}
        const baseDocs=getRequiredDocs();
        const condDocs=await getConditionalDocs(f.destination,f.incoterms,f.customer);
        const docs=[...baseDocs,...condDocs];
        await sb.from('checklist_items').insert(docs.map(d=>({
          order_id:newOrder.id,
          order_number:orderNumber,
          category:d.category,
          document_type:d.docType,
          source:d.source,
          status:'Pending',
          signature_required:d.signatureRequired||false,
          expected:2,
          found:0
        })));
        setModal(null);
        nav('order-detail',orderNumber);
        showToast('Order created');
      }}/>}
      {modal==="user"&&<CreateUserModal onClose={()=>setModal(null)} onCreate={f=>{setUsers(p=>[...p,{...f,id:`u${p.length+1}`,created:toDay(),active:true}]);setModal(null);showToast("User created");}}/>}
      {modal==="type"&&<CreateTypeModal onClose={()=>setModal(null)} onCreate={f=>{setOrderTypes(p=>[...p,{...f,id:`ot${p.length+1}`,docs:[]}]);setModal(null);showToast("Order type created");}}/>}

      <Toast toast={toast}/>
      {showSecurity&&<SecurityModal user={user} onClose={()=>setShowSecurity(false)}/>}
      {timeoutWarning&&(
        <div style={{position:"fixed",bottom:20,left:"50%",transform:"translateX(-50%)",zIndex:300,background:"#1e3a5f",color:"#fff",borderRadius:10,padding:"12px 20px",fontSize:13,display:"flex",alignItems:"center",gap:12,boxShadow:"0 4px 24px rgba(0,0,0,.25)"}}>
          <i className="ti ti-clock-exclamation" style={{fontSize:18,color:"#fbbf24"}}/>
          <span>You'll be signed out in 2 minutes due to inactivity.</span>
          <button onClick={()=>setTimeoutWarning(false)} style={{background:"#fff",color:"#1e3a5f",border:"none",borderRadius:6,padding:"4px 12px",fontSize:12,fontWeight:600,cursor:"pointer"}}>Stay signed in</button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
